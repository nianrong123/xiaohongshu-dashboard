\n但自从我和队友变相降薪20%后，就打算给娃精简一下暑假班，做断舍离。现在我们除了保留几个必要的，其余都是在小破站上自学，上面的老师专业又幽默，关键是性价比高🆓，真的太香了~\n.\n🌈今天给大家分享几个女儿蕞常看的宝藏up主\n.\n✅数学：\n✔一升二，看：摩比思维馆（专注数学思维启蒙，有趣的教具和互动游戏，帮助建立兴趣）\n✔二升三，看：谢天洲(小学数理的全面系统讲解，重视数学体系的建立)\n✔三升四，看：脑王杨易（清华本硕，最强大脑冠军。精讲小阶数学的数感、逻辑等8个底层思维能力，帮助普娃举一反三）\n✔四升五，看：一数（讲题思路清晰，有难度，推荐基础好，想要进一步完善自身知识体系的构建的学生）\n✔五升六，看：张齐华(条理清晰，上课节奏很好)\n.\n✅语文：\n✔一升二，看：语文莹莹老师（以基础知识串讲为主，包括生字、成语、文言文、阅读理解）\n✔二升三，看：我就是皮皮儿（擅长讲解名著，讲解方式通俗易懂）\n✔三升四，看：白马阅读写作（高芬作文技巧，主打写作，讲各种写作方法，包括范文拆解、素材分析等）\n✔四升五，看：梓墨说语文（主要讲解阅读和写作2部分，经验丰富。老师主页还有知识点的分类)\n✔五升六，看：戴建业教授（讲古诗词，生动有趣，非常受学生欢迎 ）\n.\n✅英语：\n✔二升三，看：敏而巧学（英文童话故事，自然科普从入门到高阶一点的都有）\n✔三升四，看：Leo老师（课程围绕课本内容，语法会按照造句的方式来讲，适合拔高）\n✔四升五，看：陈君老师（新概念英语，讲得很完整很系统）\n✔五升六，看：英语兔（英语拓展课，讲口语和语法，开拓国际视野）\n.\n🔥小四门\n✅物理看：麻辣老师\n✅地理看：地理北纬老师\n✅生物看：林旭生物讲堂\n✅历史看：讲历史的张老师\n———\n🔹除了放学后刷博主视频，果果每天也会花20分钟，跟着线上老师做精读训练，读的是新课标推荐书单，老师边读边带着圈画好词好句，教100多种阅读技巧，因为一节课时间不长，娃坚持起来也不难。\n🔹坚持一年，我发现女儿开窍了。后面会继续坚持，我们计划小破站+线上精读相结合，无需补习也能进步很大！\n\t\n#家有小学生[话题]# #小学[话题]# #孩子的进步[话题]# #兴趣班[话题]# #小学生日常[话题]# #孩子兴趣班[话题]# #兴趣班推荐[话题]# #小学阅读[话题]# #暑期[话题]# #教育规划[话题]#","images":["6a5f686b0000000001031914_0.jpg"],"coverImage":"6a5f686b0000000001031914_0.jpg","tags":["家有小学生","小学","孩子的进步","兴趣班","小学生日常","孩子兴趣班","兴趣班推荐","小学阅读","暑期","教育规划"],"color":2,"scrapedAt":"2026-07-29T17:30:00"},{"title":"已陪跑完小学，回头看语文！！","author":"果果向前冲","time":"2026-07-20","url":"https://www.xiaohongshu.com/explore/6a5e1ff10000000005039202","topic":"优质好贴","likes":42,"comments":45,"shares":0,"collects":61,"imgs":1,"summary":"📚陪果果跑完小学六年，回头看语文这场马拉松，真是感慨万千。从阅读理解看不懂、写作文流水账，到现在，语文每次都是满芬，XSC顺利上岸重点初中。没有谁是天生的笨小孩，大宝改变的背后，都是精准方法+坚持不懈的功劳\n.\n作为12年教龄的班主任+一位妈妈，今天掏心窝聊聊那些年跟风踩过的坑，和真正让大宝“开窍”的好资源👇\n.\n1️⃣张泉灵阅读课\n⏰使用场景：每天放学后20分钟 / 睡前碎片时间\n🌟真实感受：最省妈没有之一！名著拆解像追剧一样上瘾，孩子能自主完成整本书精读。每天跟着圈画重点，周末检查笔记就能掌握进度。坚持半年肉眼可见作文不再流水账，阅读理解能精准踩分。现在二宝直接继承账号，哥哥的批注本都成传家宝了！\n·\n2️⃣李濛同步课堂\n⏰使用场景：单元考前突击 / 寒暑假补差\n🌟真实感受：字词基础弱的孩子闭眼入！把课本拆解得明明白白，配套的听写小程序拯救听写困难户。但课程节奏偏慢，建议1.25倍速播放，基础好的孩子可能会觉得枯燥。\n·\n3️⃣学而思大语文\n⏰使用场景：周末系统学习 / 小升初突击\n🌟真实感受：录播课里的六边形战士，从阅读技法到作文模板全覆盖。但单节课90分钟太费眼！建议拆分成2天学习，配套的纸质练习册比视频更有价值，建议直接买材料搭配其他短时课程使用。\n·\n4️⃣戴建业诗词课\n⏰使用场景：碎片化听故事 / 培养古文兴趣\n🌟真实感受：教授讲段子比德云社还有趣！但知识点零散不适合应试，更适合拓展文学素养。我家当睡前故事听，现在孩子能脱口而出 \"找仙人、采仙草、炼仙丹\" 的梗，算是意外收获。\n·\n5️⃣李君卿阅读营\n⏰使用场景：期中期末冲刺 / 阅读理解特训\n🌟真实感受：解题公式直接焊进脑子！但课程强度堪比军训，建议寒暑假集中攻克。我家连续跟了21天打卡营，阅读理解从扣12分降到3分，不过结束后不持续练习会反弹。\n·\n✅过来人建议：\n优先选张泉灵（培养兴趣）+李濛（打基础）\n碎片时间用戴建业磨耳朵\n·\n语文真不是靠砸钱就能堆出效果的！我家走过最大的弯路就是同时报3个直播课，结果孩子疲于赶课根本没时间消化。现在固定 \"1个主线课 + 碎片化拓展\" 模式，反而实现了无痛逆袭。\n·\n各位宝妈记住：选课不是选最贵的，而是选能坚持的！那些让孩子学完主动说 \"妈妈明天还想上\" 的课程，才是真正的王者。\n\t\n#小学语文[话题]# #小学阅读[话题]# #二年级[话题]# #三年级[话题]# #阅读写作[话题]#","images":["6a5e1ff10000000005039202_0.jpg"],"coverImage":"6a5e1ff10000000005039202_0.jpg","tags":["小学语文","小学阅读","二年级","三年级","阅读写作"],"color":3,"scrapedAt":"2026-07-29T17:30:00"},{"title":"二年级回头看，庆幸精简教辅这条路，走对了","author":"果果向前冲","time":"2026-07-15","url":"https://www.xiaohongshu.com/explore/6a57795c000000001702db63","topic":"优质好贴","likes":9,"comments":2,"shares":0,"collects":15,"imgs":1,"summary":"从教十多年了，最欣慰的就是看到越来越多家长在给孩子选教辅时，开始走精简路线👏\n说起教辅选择，我见过太多家长踩坑。不少学生家里书柜堆得像小山，好多教辅翻了几页就闲置了。经过多年观察，我发现：教辅真不是越多越好，选对几本比啥都强！\n.\n⭕数学：基础+拓展双管齐下\n数学方面，《53天天练》打基础，再配《学霸》和《举一反三》做拓展，搭配着用刚好。\n▪️《53》每天做一页，重点不是做完就忘，而是把错题拎出来。准备一个专属错题本，每周六专门抽时间把一周的错题重刷一遍，确保基础不丢分。\n▪️《学霸》建议留到周末做，题目更灵活多变，正好补了《53》偏基础的短板。《举一反三》就是系统练思维的，每周啃一个专题，慢慢拓展孩子思路。\n.\n⭕英语：选对两本，坚持就赢了\n推荐锁定《周计划》和《朗文分级阅读》，简单高效。\n▪️《周计划》每天就做一页，包含听力和词汇，15分钟就能搞定。重点是坚持不间断，能坚持下来的孩子，词汇量肉眼可见地涨，基础特别扎实。\n▪️《朗文》分级阅读可以让孩子自己选，每天晚上睡前读一本。因为故事有意思，孩子都主动捧着书读，根本不用催。兴趣提起来了，学英语自然不费劲。\n.\n⭕语文：两本教辅就够顶\n核心就用《绘本课堂》和《一本》就够了。\n▪️《绘本课堂》特别适合预习。里面插图丰富，讲解也不枯燥，孩子自己翻着都愿意看。我建议不贪多，不要求全做完，就挑课后重点练习做，主要帮孩子抓牢课文核心考点。\n▪️《一本》的阅读训练建议每天做一篇，关键是做完后必须对着答案复盘，让孩子自己讲清楚为啥选这个选项，知道思路后，做阅读题就不再瞎蒙了！\n💡提升小技巧：每天安排30分钟看书时间，培养阅读习惯，增加阅读量。我的一个学生从一年级就开始跟着线上精读📚，每天 15 分钟，老师带着孩子读新课标推荐书目，边读边学阅读方法，教娃怎么体会作者感情，怎么提炼文章主旨，阅读理解和写作文基本都不用费心。语文成绩直线提升，如今稳定在95+！坚持精读真的是能让孩子长期受益的！\n.\n🌱从教多年总结的大实话:\n别盲目跟风买教辅，适合孩子的才是王炸\n十本做不完不如吃透两三本，精做比泛做好百倍\n错题本的价值远超新题本，把漏洞补牢才管用\n好的线上课真能帮孩子开窍，但一定要选重底层方法的\n养娃路上真的不是越多越好，有时候\"少而精\"才是最高效的。\n\t\n#二年级[话题]# #教辅推荐[话题]# #自主学习[话题]# #小学语文[话题]# #小学阅读[话题]#","images":["6a57795c000000001702db63_0.jpg"],"coverImage":"6a57795c000000001702db63_0.jpg","tags":["二年级","教辅推荐","自主学习","小学语文","小学阅读"],"color":4,"scrapedAt":"2026-07-29T17:30:00"},{"title":"没矿的家庭，千万不要让孩子碰这4个爱好","author":"果果向前冲","time":"2026-06-07","url":"https://www.xiaohongshu.com/explore/6a22e827000000001503fff9","topic":"优质好贴","likes":13,"comments":1,"shares":0,"collects":3,"imgs":1,"summary":"坐标北京，老大初一，老二五年级。今年还没过到一半，我算了笔账，最大的感悟就是：兴趣班才是当代碎钞机！没矿的家庭，这些爱好一定要谨慎选择，别让兴趣变成家庭负担😭\n·\n🏊游泳\n刚开始孩子还很有兴趣，但是换季的时候就有下水困难症，果果之前下水都被冻的嘴唇发紫，而且游泳镜因为压着眼眶，医生说是对视力不好。果果已经游了2年了，我还在纠结要不要长期练游泳练练速度啥的，后来孩子爸爸说生存技能已经会了要速度干啥？而且想游随时去游泳馆，就给娃停了\n·\n🏇马术＆高尔夫\n马术俱乐部年费两三万打底，骑一次马鞍时费几百块！马术装备头盔、马靴、护甲一套下来，直接掏空年终奖！类似的还有高尔夫，这些运动华而不实，没必要为了所谓的高端社交圈拓展，逼孩子学这些。\n·\n📸钢琴\n果果开窍晚，从去年第9年的时候，自己才感觉热爱了，自己的歌单也都换上了f小调幻想曲。虽然水平还是一般，但我挺高兴的，我总感觉在他长大后的气质里会流淌这10几年的琴声，他的自信里也有音乐的功劳。但是身边好朋友都没少给我们泼冷水说，这几年省吃俭用光在钢琴上的投入都够个房了，说的我一阵心痛，确实，一般的家庭真的不太建议。\n·\n🥌贵族运动\n网球的装备和集训需要几万块，场地费按小时收；击剑装备加课程，一年砸好几万；冰球和花样滑冰的护具、冰场费，普通家庭分分钟被掏空钱包！这哪是运动，分明是和钱过不去😭！建议寻找平替：比如把花样滑冰换成普通滑雪，滑冰，孩子喜欢就行\n·\n✅咬牙保留的班：\n1️⃣羽毛球：从幼儿园大班坚持到现在，每周2次雷打不动。前期投入5k学会基础动作，现在自带装备去免费场馆打，既护眼又长个\n·\n2️⃣线上精读：这个真的要夸！每天15分钟精读名著，老师带着拆解文章结构。现在每天坚持15分钟精读，一边练阅读，一边练表达，专业的老师授课会比他自己摸索的好，现在孩子做阅读题的时候答题思路清晰，写作文也很丝滑，半小时不到就能写好一篇600字作文！\n·\n当妈七年悟出来了：报ban就像开盲盒，光砸钱没用！关键得看：\n1️⃣孩子是不是真喜欢\n2️⃣对升学有没有助力\n3️⃣能不能转化为长期技能\n·\n现在周末带娃泡图书馆、逛博物馆，发现不报班反而更亲子了～其实教育哪有标准答案，咱们量力而行就好啦！\n\t\n#小学[话题]# #孩子教育[话题]# #兴趣班[话题]# #辣妈育儿记[话题]# #三年级[话题]# #鸡娃[话题]#","images":["6a22e827000000001503fff9_0.jpg"],"coverImage":"6a22e827000000001503fff9_0.jpg","tags":["小学","孩子教育","兴趣班","辣妈育儿记","三年级","鸡娃"],"color":0,"scrapedAt":"2026-07-29T17:30:00"},{"title":"一年级回头看，庆幸精简教辅这条路，走对了\n.\n从教十多年了，","author":"果果向前冲","time":"2026-06-04","url":"https://www.xiaohongshu.com/explore/6a215dbe0000000038034dab","topic":"优质好贴","likes":19,"comments":8,"shares":0,"collects":24,"imgs":1,"summary":"一年级回头看，庆幸精简教辅这条路，走对了\n.\n从教十多年了，最欣慰的就是看到越来越多家长在给孩子选教辅时，开始走精简路线👏\n说起教辅选择，我见过太多家长踩坑。不少学生家里书柜堆得像小山，好多教辅翻了几页就闲置了。经过多年观察，我发现：教辅真不是越多越好，选对几本比啥都强！\n.\n⭕数学：基础+拓展双管齐下\n数学方面，《53天天练》打基础，再配《学霸》和《举一反三》做拓展，搭配着用刚好。\n▪️《53》每天做一页，重点不是做完就忘，而是把错题拎出来。准备一个专属错题本，每周六专门抽时间把一周的错题重刷一遍，确保基础不丢分。\n▪️《学霸》建议留到周末做，题目更灵活多变，正好补了《53》偏基础的短板。《举一反三》就是系统练思维的，每周啃一个专题，慢慢拓展孩子思路。\n.\n⭕英语：选对两本，坚持就赢了\n推荐锁定《周计划》和《朗文分级阅读》，简单高效。\n▪️《周计划》每天就做一页，包含听力和词汇，15分钟就能搞定。重点是坚持不间断，能坚持下来的孩子，词汇量肉眼可见地涨，基础特别扎实。\n▪️《朗文》分级阅读可以让孩子自己选，每天晚上睡前读一本。因为故事有意思，孩子都主动捧着书读，根本不用催。兴趣提起来了，学英语自然不费劲。\n.\n⭕语文：两本教辅就够顶\n核心就用《绘本课堂》和《一本》就够了。\n▪️《绘本课堂》特别适合预习。里面插图丰富，讲解也不枯燥，孩子自己翻着都愿意看。我建议不贪多，不要求全做完，就挑课后重点练习做，主要帮孩子抓牢课文核心考点。\n▪️《一本》的阅读训练隔天做一篇，关键是做完后必须对着答案复盘，让孩子自己讲清楚为啥选这个选项，知道思路后，做阅读题就不再瞎蒙了！\n💡提升小技巧：每天安排30分钟看书时间，培养阅读习惯，增加阅读量。我的一个学生从一年级就开始跟着线上精读📚，每天 15 分钟，老师带着孩子读新课标推荐书目，边读边学阅读方法，教娃怎么体会作者感情，怎么提炼文章主旨，阅读理解和写作文基本都不用费心。语文成绩直线提升，如今稳定在95+！坚持精读真的是能让孩子长期受益的！\n.\n🌱从教多年总结的大实话:\n别盲目跟风买教辅，适合孩子的才是王炸\n十本做不完不如吃透两三本，精做比泛做好百倍\n错题本的价值远超新题本，把漏洞补牢才管用\n好的线上课真能帮孩子开窍，但一定要选重底层方法的\n养娃路上真的不是越多越好，有时候\"少而精\"才是最高效的。\n\t\n#一年级[话题]# #教辅推荐[话题]# #自主学习[话题]# #小学阅读[话题]#","images":["6a215dbe0000000038034dab_0.jpg"],"coverImage":"6a215dbe0000000038034dab_0.jpg","tags":["一年级","教辅推荐","自主学习","小学阅读"],"color":1,"scrapedAt":"2026-07-29T17:30:00"},{"title":"一年级，全班第一，每晚的真实强度","author":"果果向前冲","time":"2026-06-03","url":"https://www.xiaohongshu.com/explore/6a201035000000003701e44b","topic":"优质好贴","likes":104,"comments":28,"shares":0,"collects":122,"imgs":1,"summary":"掏心窝子说一句💔：一年级不卷分数，但一定要卷习惯！固定好每天80%动作真的有效\n一二年级平平无奇，三年级却突然逆袭成黑马的孩子，靠的就是家长规划的每天清晰可执行的规划👇\n.\n1️⃣ 兴趣班断舍离\n古筝/围棋/舞蹈…不喜欢的班立刻停！强扭的瓜不甜，省下时间做更有意义的事\n2️⃣ 运动计划\n每天跳绳200个打底，专注力蹭蹭涨，体测还能拿满分！\n3️⃣ 学习习惯养成\n👉书包自己理！作业自己记！\n👉写字姿势盯紧（近视警告‼️）\n👉每天复述课堂内容（防走神神器！）\n4️⃣ 作业精准狙击\n拒绝无效刷题❗每天20分钟吃透课本例题，比做100道题管用！\n.\n📚数学：计算速度+思维双杀\n1⃣计算：每天限时20道口算，抓准确率（速度＞难度！）\n2⃣课本为王：例题必须能讲清步骤（家长装不懂，让孩子当老师！\n3⃣思维：每天做三道初级浅奥，或者做数独\n.\n📚英语：听力先行+敢开口\n1⃣单词：每天5新词+旧词滚动复习（单词卡打卡，成就感拉满！）\n2⃣动画片：每天20分钟《小猪佩奇》英文版（遮字幕跟读，表情动作夸张模仿！）\n3⃣场景化输出：洗澡/吃饭时玩英语快问快答（What’s this? → It’s a spoon! 越搞笑越记得牢！\n.\n📚语文：死磕基础+积累\n1⃣字词听写：每天10分钟听写课本生字，错字抄3遍+造句（基础分必须拿满！）\n2⃣晨读晚诵：必背古诗/课文拆解到每天，碎片时间复述课文（防死记硬背！）\n3⃣阅读：每天花15分钟精读名著，深入思考+口头总结（练逻辑！）\n小学阶段的阅读不能无脑泛读，效果不大，更重要的是学会精读，会拆书、会积累。我家孩子每天都跟十五分钟精读，边读边学阅读方法，孩子学会了体会作者感情，怎么提炼文章主旨，从一年级的看图写话，到三年级之后的阅读理解、大作文，果果都没让我费过心\n4⃣小作文：每周2篇看图写话，用“谁+在哪里+干什么”公式起步（拒绝凑字数！）\n.\n⚠️终极提醒：\n✅一年级核心是习惯＞分数！\n✅每天30分钟高效学习+20分钟运动，比周末狂补5小时有用！\n✅兴趣班不喜欢的立刻停！省下时间多阅读+户外！\n.\n一年级偷懒＝三年级熬夜补窟窿！只需要按我上述的安排固定每天80%动作—主抓习惯，将来辅导作业少吼100句‼️\n\t\n#小学生的学习习惯[话题]# #陪孩子学习[话题]# #一年级[话题]# #一年级语文[话题]# #小学阅读[话题]#","images":["6a201035000000003701e44b_0.jpg"],"coverImage":"6a201035000000003701e44b_0.jpg","tags":["小学生的学习习惯","陪孩子学习","一年级","一年级语文","小学阅读"],"color":2,"scrapedAt":"2026-07-29T17:30:00"},{"title":"1、选小学，离家近就是王道，少在路上折腾，多留时间给学习。\n","author":"萨萨","time":"2026-07-29","url":"https://www.xiaohongshu.com/explore/6a6979ee0000000011012b53","topic":"优质好贴","likes":4,"comments":0,"shares":0,"collects":6,"summary":"1、选小学，离家近就是王道，少在路上折腾，多留时间给学习。\n2、练字！练字！练字!!至少坚持三年，好处多多。\n3、小学最重要的是培养习惯，同时激发和保护学习兴趣，兴趣才是最好的老师。\n4、成绩不好不可怕，动作慢才要命。用速度换成绩，年级越高，时间就越宝贵。\n5、读书声音小?那可不行!声音越大，记忆越深刻，语感也越好。\n6、别小看预习，这是你超越别人的好机会。\n7、能进重点班就别去普通班，能进名校就别进一般学校。几年后，差距就显现了。\n8、校内学习要紧跟，别脱节。校内搞不定，就别忙着校外拓展。\n9、补习班大多是焦虑税，兴趣班也别乱报，挖掘兴趣才是关键。\n10、身体健康、保护视力、亲子关系，这三点做不到，就别急着鸡娃。\n·\n班主任告诉你，小学规划这样做:\n.\n⭕️[英语学习]\n1⃣️、厉害父母都注重课外拓展、海量阅读。\n2⃣️、英语学不好?那就是懒!多听、多读、多背就对了。\n3⃣️、低年级看动画、听儿歌;高年级听新闻、新概念等。关键是坚持!\n4⃣️、英语单词尽早背。\n5⃣️、课内英语仅面向普通孩子，要想成为优势学科，必须快人一步并持之以恒。\n.\n⭕️ [数学学习]\n1⃣️、立足课本，学有余力再学奥数。别太过看重奥数，基本功才最重要。\n2⃣️、计算基础要打牢，每日必做。《口算笔算天天练》坚持练起来!\n3⃣️、思维拓展不能丢，但别硬啃奥数。我家老二跟风上了一个线上小班，没想到很惊喜，因为人数少，互动很高频，娃能够很专注。动画+真人互动，一周两次。现在基本不需要我们操心。\n4⃣️、别总说孩子粗心，错了就是错了。踏实吃透课本比什么都强。\n.\n⭕️[语文学习]\n1⃣️、一二年级抓拼音、识字量，语文学好了，其他学科也受益。\n2⃣️、坚持课外阅读，提升阅读速度和理解力。从绘本到名著，一步步来学。\n3⃣️、每天晨读，用《337晨读》书，科学晨读代替死记硬背。\n4⃣️、古诗和小古文提前背，培养语感，到了高年级更轻松。\n.\n⭕️[学习习惯养成]\n1⃣️、正确写作业方法:做好准备、用番茄时钟法提升专注力、自行检查并订正。\n2⃣️、远离手机，保护专注力和思考力。\n3⃣️、别忽视孩子的粗心问题，那其实是掌握知识不牢固的表现。\n\t\n#一年级[话题]# #家有小学生[话题]# #辣妈育儿经[话题]#","images":["6a6979ee0000000011012b53_0.jpg"],"coverImage":"6a6979ee0000000011012b53_0.jpg","tags":["一年级","家有小学生","辣妈育儿经"],"color":3,"scrapedAt":"2026-07-29T10:00:00"},{"title":"废掉一个女孩最简单的方式：就一天到晚的说她\n.\n有位宝妈和我","author":"萨萨","time":"2026-07-29","url":"https://www.xiaohongshu.com/explore/6a693d3f000000000f02aa3a","topic":"优质好贴","likes":3,"comments":0,"shares":0,"collects":4,"summary":"废掉一个女孩最简单的方式：就一天到晚的说她\n.\n有位宝妈和我分享了她的亲身经历。\n她家小姑娘脑子灵活，学东西很快，外人全都夸孩子聪明懂事。\n只有妈妈心里清楚，孩子有个很难解决的毛病：做事懒，干什么都没有主动性。\n学习上完全被动，从来不会自己安排任务。\n写作业习惯性拖到最后一刻才动手，坐在书桌上面注意力涣散，小动作不断，根本沉不下心学习。\n这位妈妈每天都在唠叨、催促中度日。\n张口常常就是：\"又走神了？\"\"做事磨磨蹭蹭！\"\"能不能自觉一点？\"\"说了多少次，怎么总不改！\"\n.\n💡所谓“杯满则溢”，在一件事情上，如果你说得越多，孩子往往做得越差，甚至产生逆反心理。心理学上这被称作“超限效应”，意思就是外来的刺激过多，过强或作用时间过久，就会使人感觉不耐烦。\n.\n如何恢复孩子的内驱力呢？那就是学会“闭嘴”，用观察孩子代替评判孩子，用倾听和共情取代说教。我带孩子的这几年，会允许孩子有自己的节奏，关注点也不会只放在学习上，而是为孩子在学习主线外找到了许多大大小小的支点👇\n.\n举一些我能想到的简单例子 :\n1️⃣把生活独立放在成绩前面\n🔸家庭劳动日：每周五晚上全家大扫除，每人一块区域，锻炼孩子的动手能力和自理意识\n🔸超市自由日：每月给孩子安排一次限额200的自由采购日，满足孩子买买买的小心愿，有次我带她去超市，回来给妈妈带了一束花（有点小感动哦～）\n\t\n2️⃣先建立亲密，再谈规则\n🔸幸福储蓄罐：家庭成员每周写一件感到幸福的小事放进储蓄罐，每个月定期拿出来看一下，分享喜悦\n🔸小鬼当家：每月抽一天时间，我们会和孩子的角色互换，让她安排家庭生活，培养她的规划意识\n.\n3️⃣培养兴趣爱好\n🔸 兴趣班断舍离：学过围棋/编程/钢琴，但只保留真正喜欢的美术和游泳\n🔸最近还爱上了摄影，就是从一次出门拍照开始的。他说：“我想把我眼里的东西留下来。”那种由内而发的兴趣，是任何学习任务都比不上的。\n\t\n4⃣用长期主义代替无效努力\n🔸数学思维：小学要重视数学思维培养而非盲目刷题，我们一直很重视这点，从大班开始就在做思维训练，一周两次，选的是线上小班互动性很强，很专注。现在三年级遇到又长又复杂的应用题也会自己画图捋顺思路，常年在98分+。思维培养得好，是真的很省妈！\n🔸英语语感：每天15分钟《神奇树屋》音频磨耳朵，坚持RAZ阅读，每周1本，拓展词汇量\n\t\n#家庭教育[话题]# #儿童自控力[话题]# #数理思维[话题]# #鸡娃[话题]# #家有小学生[话题]#","images":["6a693d3f000000000f02aa3a_0.jpg"],"coverImage":"6a693d3f000000000f02aa3a_0.jpg","tags":["家庭教育","儿童自控力","数理思维","鸡娃","家有小学生"],"color":4,"scrapedAt":"2026-07-29T10:00:00"},{"title":"一家托举出俩985，我们的秘诀：三个小约定\n.\n🌳写作业小","author":"萨萨","time":"2026-07-29","url":"https://www.xiaohongshu.com/explore/6a69307d000000001101372a","topic":"优质好贴","likes":13,"comments":10,"shares":0,"collects":17,"summary":"一家托举出俩985，我们的秘诀：三个小约定\n.\n🌳写作业小约定\n1、落座前把该喝的、该跑的、该拿的都搞定，别一会儿起来一趟。\n2、闹铃一响就动笔，不磨蹭、不等\"状态来了\"——越等越懒。\n3、课本、笔尺、本子提前摆好桌角，免得写到一半翻书包翻到分神。\n4、读题不急，用手指点着轻声念一遍，不跳字、不添字。\n5、速度先放一放，笔画写端正比写得快要紧。\n6、腰挺直、脚踩地，不歪不靠不托腮，坐稳了精神才聚得起来。\n7、作业时间不说话、不串座、不东张西望，安安静静啃完。\n8、遇到卡壳的题先跳过去，做个记号回头再想，别在死胡同里耗光耐心。\n9、全部写完后自己从头捋一遍，确认没漏没错再合上本子。\n10、收工后把桌面收拾干净，书本归位、台灯关掉，做事有头有尾。\n.\n🌳阅读积累小约定\n古诗文趁早铺路：小学和初中必背的古诗词，加上16篇核心文言文，争取小学阶段全部过完。这样到了初中，别人还在为背古文熬灯苦战，咱家孩子就能把时间腾给数理化和薄弱科目。\n.\n🌳数学解题小约定\n1、读题至少两遍：第一遍知道大概讲什么，第二遍拿笔把关键数字圈出来。\n2、把条件单独摘出来，画个简单图表或线段图，让思路一下子清晰。\n3、下笔前先想好先算什么、后算什么，草稿纸上试推一步，免得走弯路。\n4、做完后逐项回查：数字抄对没、单位写了没、步骤齐不齐，一个不漏。\n5、每周固定做思维训练，想要高年级不掉队，思维训练一定一定要跟上，非常重要！我们一直在上思维训练，很多都试过，现在上的是大浪淘沙后留下的，小班直播，不是死记硬背和刷题，而是孩子通过画图方式理解题目，主动思考，掌握学习方法，举一反三，适度拔高，现在基本稳定在98＋，不用操心。\n.\n小学六年，拼的不是报了多少班、考了多少分，而是脑子里的底层能力有没有长好。不用花大钱，但需要你沉下心、日复一日。坚持住，孩子会自己跑起来。\n#小学生习惯培养[话题]# #自主学习[话题]# #小学生家长[话题]##育儿心得[话题]#","images":["6a69307d000000001101372a_0.jpg"],"coverImage":"6a69307d000000001101372a_0.jpg","tags":["小学生习惯培养","自主学习","小学生家长","育儿心得"],"color":0,"scrapedAt":"2026-07-29T10:00:00"},{"title":"大冰老师说：普通人家的小孩，小学阶段这六年，有八个坑千万别踩","author":"萨萨","time":"2026-07-28","url":"https://www.xiaohongshu.com/explore/6a68728c0000000011019261","topic":"优质好贴","likes":0,"comments":0,"shares":0,"collects":1,"summary":"大冰老师说：普通人家的小孩，小学阶段这六年，有八个坑千万别踩。下面这些话，值得反复看几遍。\n.\n第一，别把才艺当“升学硬通货”。\n身边不少家长砸钱让孩子学琴、学舞，奔着考级拿奖去，结果到了升学关口，发现学校真正认的是体能、阅读量和计算速度。那些不盲目跟风的父母，早早把精力花在这三样基本功上，孩子后劲反而更足。\n.\n第二，别让搜题软件偷走孩子的脑力。\n遇到难题就拍照找答案，背古诗前先刷两条短视频“助兴”，看起来作业完成得快，实际上大脑在偷懒，深度思考的能力一点点退化。普通家庭的孩子最怕这种温水煮青蛙，等习惯养废了，再想追就难了。\n.\n第三，别看见别人报班就心慌。\n奥数火就报奥数，编程热就追编程，压根不管孩子有没有兴趣、能不能消化。张雪峰说得直白：多数补习班就是花钱买心安，钱花了、时间耗了，孩子该不会的还是不会，纯粹白折腾。\n.\n第四，条件有限，就把思维训练抓死。\n如果家里条件一般，承担不起高价的补习，也请不起私教，那就别贪多，把思维训练这件事做到最好就够了。我家就是这样，每周两次雷打不动的线上数学思维训练。打基础＋浅奥，人数少，互动高频，很专注。动画+真人互动，专属错题练，现在数学非常开窍，稳定在前二，基本不用我们操心。\n.\n第五，别被“快乐就好”带偏节奏。\n有些家长信奉小学就该纯玩，等到初中课程难度突然拔高，孩子根本接不住，再想补救代价极大。普通家庭容错率低，一步慢，步步慢。\n.\n第六，别拿分数当唯一目标。\n一年级就盯着100分比来比去，除了制造焦虑毫无意义。小学真正要磨的是习惯——坐得住、写得工整、做完会检查。这些看似不起眼的小事，才是未来成绩的根基。\n.\n第七，别以为进了好学校就能躺赢。\n全家使劲把孩子塞进名校，然后就觉得万事大吉。大冰老师提醒过：离开那个光环，孩子自己还剩什么？只有刻进骨子里的自主阅读习惯和独立思考能力，才是走哪都不怕的真本事。\n.\n第八，别为了面子逼孩子走别人的路。\n看别人家孩子拿奖就眼热，硬逼着自己孩子去学不擅长也不喜欢的东西，结果钱白花，亲子关系还闹僵。普通家庭过日子，务实永远比虚荣重要。\n.\n话不好听，但理不糙。普通家庭的孩子没有太多试错空间，小学六年踩稳每一步，不跑偏、不瞎忙，将来才有底气去拼。","images":["6a68728c0000000011019261_0.jpg"],"coverImage":"6a68728c0000000011019261_0.jpg","tags":[],"color":1,"scrapedAt":"2026-07-29T10:00:00"},{"title":"普通家庭的存款达到这个数，基本才能不焦虑.\n\t\n我们这代三四","author":"萨萨","time":"2026-07-27","url":"https://www.xiaohongshu.com/explore/6a67627d000000002201ad8f","topic":"优质好贴","likes":2,"comments":0,"shares":0,"collects":1,"summary":"普通家庭的存款达到这个数，基本才能不焦虑.\n\t\n我们这代三四十岁的人，太懂这种\"夹心层\"的滋味了——上有老人逐渐老去，下有孩子嗷嗷待哺，补习班、兴趣班、学费像流水一样往外淌。靠死工资过日子，想攒钱真的太难了。\n.\n有个朋友李姐算过一笔账：夫妻俩月薪加起来三万八，去掉房贷、车贷、保险、孩子教育、老人药费、日常开销，每月能剩五千都算\"丰收\"。\n.\n去年她家孩子要报个网球课，她犹豫了整整三天，\"不是买不起，是不敢动存款\"。\n.\n可就是这样的精打细算，很多人卡里的数字还是慢得像蜗牛爬。\n.\n一、20万-30万，普通家庭的\"安心数字\"\n⭕️对大多数家庭来说，存款达到20万-30万，基本能接住生活80%的意外：\n1️⃣父母突发住院时，不用在低配版病房和好药之间犹豫的底气\n2️⃣自己被裁员时，能撑半年不降低生活质量的缓冲期\n3️⃣孩子教育支出（学费、兴趣班、辅导班），不用到处开口借钱的体面\n.\n这笔钱不用拿来投资，不用追求高收益，就老老实实存在定期里。它是普通人对抗生活风险的\"第一道防线\"。\n.\n二、教育支出，吞金兽的现实\n1. 课程费用占比最高\n补习班、兴趣班、特长班，加起来轻轻松松过万。\n2. 隐性支出不容忽视\n教辅书、学习用品、课外阅读、亲子活动，像温水煮青蛙。\n3. 支出压力逐年递增\n小学低年级，到了初中，要想冲刺好学校，一对一辅导、竞赛班、冲刺营，又是一轮升级。\n都说海淀黄庄的晚风一吹，都是金钱的味道😭 家长不是心疼钱，是心疼钱花得没有底。\n.\n三、投资要选对方向\n\t\n后面开了家庭会议决定兴趣班“断舍离”，只留下了最关键的两项：\n1. 体育项目\n游泳、篮球、羽毛球，身体是革命的本钱。\n2. 数学思维\n小学阶段，思维能力绝对是最值得培养的！每天做三道初级浅奥，或者做数独。同时要借助外力，我们之前上过新加坡数学，现在找到了一个更适合的线上直播互动，专项＋浅奥，因为人数少，互动很高频，娃能够很专注。动画+真人互动，外加专属错题训练，一周两次，成绩一直很稳定在前列，基本不用我操心。\n.\n3. 家庭项目\n每年安排一次家庭旅行，或者定期的家庭活动，让家人有共同的美好回忆。\n愿每个在路上打拼的你，都能早日攒够这笔\"安心钱\"。不用大富大贵，只要心里有底，就够了。#家庭教育[话题]##陪娃成长[话题]##家有小学生[话题]#","images":["6a67627d000000002201ad8f_0.jpg"],"coverImage":"6a67627d000000002201ad8f_0.jpg","tags":["家庭教育","陪娃成长","家有小学生"],"color":2,"scrapedAt":"2026-07-29T10:00:00"},{"title":"教育部通知下来了，从今年9月份开始，上学的规则全变了，十五五","author":"萨萨","time":"2026-07-27","url":"https://www.xiaohongshu.com/explore/6a6728f5000000000f00790a","topic":"优质好贴","likes":1,"comments":0,"shares":0,"collects":0,"summary":"教育部通知下来了，从今年9月份开始，上学的规则全变了，十五五释放三大救命信号，影响最大的不是初中生，是正在读幼儿园和小学的孩子。40年没动过的九年义务教育，这次可能真的要变了。\n·\n信号一：小四门退居等级，表面减负，实则洗牌。\n北京已经先行，史地生化不再计分，只评等级。过去这些科目是普通孩子靠死记硬背翻盘的捷径。如今主赛道收窄到语数外+物理，比的不是谁更拼命，而是谁底层思维更扎实。天赋与长期积累的差距，将随时间越拉越大。\n·\n信号二：国家要的人，变了。\n规划原话是“培养能解决真实问题的拔尖创新人才”。背得熟、刷得快的孩子，AI三秒就能替代——写作文、解奥数。现在要的，是面对陌生困境能自己琢磨出出路的人。补习班“喂”出来的标准答案型选手，往后会越来越不吃香。\n·\n信号三：外部资源正在集体“贬值”。\n学区房光环消退，多校划片、教师轮岗拉平校际差距。名校重点班淡化，阳光分班、均衡师资，靠好环境硬逼的成绩，底子不牢照样露馅。\n·\n🧾学校教简单，考试变难——目的正是筛掉只会等投喂的人。下面四件事，普通家庭在家就能做，不烧钱、不费妈。\n·\n1️⃣科技视野趁早喂，最好不超过七八岁。\n未来考卷会出现基因编辑、深空探测等前沿词，孩子若头回见，光读题就耗掉大半时间。\n·\n2️⃣语文死磕阅读，性价比最高。\n高考卷面字数已超一万二，阅读慢的连题都读不完。远离口水书、快餐漫画。\n·\n3️⃣数学抓思维，别只盯着计算。\n高年级应用题增加，娃不会做、没思路，基本上是思维没打开。这点我非常认同，我们也很重视数学思维的培养，大浪淘沙选了一个线上小班，确实很惊喜——因为人少、互动频率高，能很专注。基础＋浅奥，一周两次，现在基本稳定在98+，大难题也能自己整理思路，不用我操心。\n·\n4️⃣英语启蒙走听说路线。\n弱语法、重听说，哑巴英语彻底行不通。每天看二十分钟分级动画，再循环听一小时，词汇和语感在不知不觉中攒出厚实家底。\n·\n教育的赛点，不在起跑线那几声枪响，而在家长能否看清新地图上的路标。思路转过来，脚下就是通途；转不过来，再用力也是原地打转。#小学[话题]# #家庭教育[话题]#","images":["6a6728f5000000000f00790a_0.jpg"],"coverImage":"6a6728f5000000000f00790a_0.jpg","tags":["小学","家庭教育"],"color":3,"scrapedAt":"2026-07-29T10:00:00"},{"title":"7.26后开始预习三年级，没方向直接抄我的\n.\n预习不是卷，","author":"萨萨","time":"2026-07-27","url":"https://www.xiaohongshu.com/explore/6a66990400000000110150e5","topic":"优质好贴","likes":11,"comments":10,"shares":0,"collects":3,"summary":"7.26后开始预习三年级，没方向直接抄我的\n.\n预习不是卷，而是有备无患！三年级可是真正的分水岭，作文要动笔，阅读变深奥，数学开始考验思维。之前带依依亲身踩过坑：三年级突然要写 300 字作文，整张试卷全是密密麻麻的字...\n趁着现在还能补救，这份【二升三暑假预习规划】一定收好，此攻略分享给真正需要的家长，放养式请划走！\n·\n🌟英语\n1⃣️预习三上课本：校园物品、人物、色彩、饮食等主题（每 2 天 1 单元）重点词汇：数字、人称称谓、校园活动类词汇（art、PE）特别注意 he-she、many-much 等易混词\n2⃣️动画片磨耳朵：每天 20 分钟《西游记英文版 》《蓝色小考拉》\n3⃣️巩固自拼规则：多音节词拆分（birthday=birth+day）\n·\n🌟语文（重点！）\n1️⃣狠抓生字词：三上写字表300字（特别注意“舞/燕/聚”的笔顺）\n用《同步看拼音写词语》每天听写10个词（错字要组词订正）\n2️⃣提前背重点课文：\n《大青树下的小学》《秋天的雨》全文背诵\n古诗《山行》《赠刘景文》注释要背透\n3️⃣重视阅读（最低成本，但却见效最快！）：\n语文学习是门童子功，二升三正是培养的黄金时期，提升的阅读和写作能力是我的首要目标。\n·\n🌟数学\n1⃣️预习三上重难点：\n▶︎长度、质量单位换算：1 千米 = 1000 米、1 千克 = 1000 克（结合日常物品练习）\n▶︎三位数进退位加减：4562-198 这类凑整巧算题型\n▶︎倍的实际问题：铅笔 2 元一支，买 6 支一共多少钱？这类隐藏数量关系应用题\n▶︎长方形正方形周长计算：分清周长概念，不要和面积概念混淆（易错！）\n2️⃣玩懂分数：披萨切块游戏理解 1/2、1/4\n3️⃣重视数学思维：三年级前看计算，三年级后看思维。建议一周两次数学思维训练，小班＋真热闹互动，学习数感、逻辑推理等思维方法，搭配浅奥练习，培养深度思考的能力。坚持练习，数学开窍，系统培养数感、逻辑思维等核心能力。\n.\n给所有二升三妈妈提个醒：三年级开始的作业量是翻倍的，暑假提前养成每天学习 30 分钟的习惯，相当于给新学期加装 “小马达”。学习就像跑马拉松，前半程蓄好力，后半程才不会瘫！共勉💪\n#家有小学生[话题]# #小学生的学习习惯[话题]# #孩子的进步[话题]# #暑假[话题]# #二升三[话题]# #新三年级[话题]#","images":["6a66990400000000110150e5_0.jpg"],"coverImage":"6a66990400000000110150e5_0.jpg","tags":["家有小学生","小学生的学习习惯","孩子的进步","暑假","二升三","新三年级"],"color":4,"scrapedAt":"2026-07-29T10:00:00"},{"title":"过来人：刚上一年级要面对的“潜规则”\n.\n这些事你不给他挑明","author":"萨萨","time":"2026-07-27","url":"https://www.xiaohongshu.com/explore/6a668d240000000011005fb3","topic":"优质好贴","likes":10,"comments":16,"shares":0,"collects":20,"summary":"过来人：刚上一年级要面对的“潜规则”\n.\n这些事你不给他挑明，孩子吃了闷亏哭都找不着调。\n.\n1️⃣没人跟你玩就自己玩，别凑上去讨好。越上赶子别人越不把你当回事。独处比讨好高级一百倍。\n.\n2️⃣ 学校里老师要管几十个孩子，没精力去猜每个小朋友的心思。想上厕所、没听懂、被欺负了，一定要大声说出来。憋着扭捏，最后难受的是自己。会表达的孩子才少吃亏，这点越早练越好。\n.\n3️⃣ 真有淘气包动手动脚，别只知道哭。谁抢你东西、推你，直接大声喊回去：“别碰我！”第一时间告诉老师，别闷头当软柿子。你越怂别人就越欺负你，反抗一次他们就知道你不是好惹的。\n.\n4️⃣ 有些孩子会拿零食玩具“收买”人，今天给你颗糖，明天让你帮忙写作业。同学给的小零食小玩具，不能随便收。平白无故拿人家东西，回头人家让你干啥你都不好意思拒绝。吃人嘴软从小就得懂。\n.\n5️⃣ 小孩子天真，以为交换秘密就是铁哥们。但今天的好朋友可能明天就闹掰。不要什么秘密都和好朋友说，转头就可能被全班知道。你的小秘密就是你的底牌，不是换友情的筹码。\n.\n6️⃣ “别告诉老师”“别跟你爸妈说”，这种话一出来就得警惕。有人让你帮忙瞒着老师家长干坏事，直接拒绝。哪怕得罪他也没关系。做错事背锅的只会是你，真出了事他们跑得比谁都快。\n.\n7️⃣ 真遇到解决不了的事，第一时间找爸妈别觉得丢脸。你硬扛出事才是真的傻，爸妈永远是你的后盾。\n.\n8️⃣先顾好自己再帮别人。你铅笔橡皮都不够用别充大方全给人。自己永远是第一位！\n.\n9️⃣ 关于学习\n小学知识变多变复杂，一定培养小学生的思维，尤其数学思维。小学阶段每天做三道初级浅奥，或者做数独。同时要借助外力，我们之前上过新加坡数学，现在找到了一个更适合的线上直播互动，专项＋浅奥，因为人数少，互动很高频，娃能够很专注。动画+真人互动，外加专属错题训练，一周两次，成绩一直很稳定在前列，基本不用我操心。\n.\n这些不是教娃学坏，是让你娃心里有数。\n善良可以但得带点锋芒。","images":["6a668d240000000011005fb3_0.jpg"],"coverImage":"6a668d240000000011005fb3_0.jpg","tags":[],"color":0,"scrapedAt":"2026-07-29T10:00:00"},{"title":"9岁儿子全班第一的邪修方法：看纪录片！\n.\n力荐小学生必看纪","author":"萨萨","time":"2026-07-26","url":"https://www.xiaohongshu.com/explore/6a66117a000000001003d762","topic":"优质好贴","likes":23,"comments":38,"shares":0,"collects":56,"summary":"9岁儿子全班第一的邪修方法：看纪录片！\n.\n力荐小学生必看纪录片清单来啦，涵盖自然、科学等领域🙏助力孩子开阔眼界、增长知识～\n.\n🌈语文\n✅《跟着书本去旅行》： 855 集，每集 18 分钟\n✅《论语里的大智慧》：550 集，每集 5 分钟\n✅《中国通史》：100 集，每集 45 分钟\n✅《宗师列传・唐宋八大家》：11 集，每集 90 分钟\n✅《定风波》：5 集，每集 50 分钟\n✅《唐之韵》：20 集，每集 20 分钟\n.\n🌈数学\n✅《像乌鸦一样思考》：20 集，每集 10 分钟\n✅《用动画片学奥数》：38 集，每集 6 - 15 分钟\n✅《神奇的数字》：3 集，每集 58 分钟\n✅《数学的故事》：4 集，每集 60 分钟\n✅《托起人类文明的数学》：5 集，每集 48 分钟\n✅《解码数学》：3 集，每集 60 分钟\n.\n🌈英语\n✅《新概念英语动画版》：多季，每集 10 - 15 分钟\n✅《小猪佩奇》：多季，每集 5 - 10 分钟\n✅《玛泽的故事》：26 集，每集 10 分钟\n✅《牛津树英语动画》：多集，每集 5 分钟左右\n✅《汪汪队立大功》：多季，每集 20 分钟左右\n✅《爱冒险的朵拉》：多季，每集 25 分钟左右\n.\n🌈物理\n✅《我的牛顿教练》：6 集，每集 25 分钟\n✅《宇宙时空之旅》：13 集，每集 45 分钟\n✅《与霍金一起了解宇宙》：3 集，每集 44 分钟\n✅《科学大实验》：40 集，每集 10 分钟\n.\n🌈化学\n✅《美丽化学》：24 集，每集 2 - 3分钟\n✅《化学史》：3 集，每集 60 分钟\n✅《我们需要化学》：6 集，每集 15 分钟\n✅《门捷列夫很忙》：5 集，每集 25 分钟\n.\n🌈生物\n✅《影响世界的中国植物》：10 集，每集 50 分钟\n✅《生命的故事》：6 集，每集 60 分钟\n✅《种出个地球》：3 集，每集 60 分钟\n✅《工作细胞》：2 季共 22 集，每集 25 分钟\n.\n🌈地理\n✅《地球脉动》：3 季共 25 集，每集 60 分钟\n✅《航拍中国》：4 季共 34 集，每集 50 分钟\n✅《蓝色星球》：2 季共 15 集，每集 60 分钟\n✅《从太空看地球》：4 集，每集 50 分钟\n.\n🌈政治\n✅《辉煌中国》：6 集，每集 50 分钟\n✅《大国崛起》：12 集，每集 45 分钟\n✅《大国外交》：6 集，每集 45 分钟\n✅《创新中国》：5 集，每集 50 分钟\n.\n【思维开窍核心秘籍👇👇】\n除了假期刷小破站的优质博主视频，我们还让娃一周上两次线上数学思维，因为人数少，互动很高频，娃能够很专注。动画+真人互动，外加错题训练，一周两次。现在非常开窍，晚上回家做作业也不需要盯着，自主就能完成。\n#班主任视角[话题]# #教育孩子[话题]#","images":["6a66117a000000001003d762_0.jpg"],"coverImage":"6a66117a000000001003d762_0.jpg","tags":["班主任视角","教育孩子"],"color":1,"scrapedAt":"2026-07-29T10:00:00"},{"title":"近日，上海一位211爸爸火了，不是因为他是网红，而是他的教育","author":"萨萨","time":"2026-07-26","url":"https://www.xiaohongshu.com/explore/6a65fff700000000110128a1","topic":"优质好贴","likes":1172,"comments":116,"shares":0,"collects":2127,"summary":"近日，上海一位211爸爸火了，不是因为他是网红，而是他的教育方式，每晚让孩子九点半准时睡觉，成绩却能一路开挂，班主任追问后惊讶，他的教育理念竟如此先进！！\n.\n孩子爸爸分享：三年级开始，学习难度逐渐增大，孩子越往高年级会越感到力不从心，要想跟上同龄人的脚步，除了培养好的学习习惯，更重要的是把“高效”刻进骨子里，而不是把“熬夜”当成努力。\n.\n三年级开始，学习难度逐渐增大，很多家长就急着买卷子、报班、延长学习时间。但他反其道而行——坚决不搞疲劳战。\n.\n下面我把爸爸现场掏心窝的5条实操铁律整理出来，姐妹们直接抄作业！📝\n.\n第一，把作业“切割”成三段，杜绝无效磨蹭。\n孩子放学后先休息20分钟（吃点水果、活动一下），然后开始写作业。他把作业分成：\n①抄写类（简单、费时少）→②计算/基础类（中等难度）→③思考类（难题、作文）。前两类在学校延时服务或饭前搞定，第三类留到饭后集中攻克。每完成一段，休息5分钟。这样孩子心里有数，不会一晚上对着所有作业发呆。\n.\n第二，错题本不抄题，只“讲题”。\n他家错题本从不让孩子完整抄题目，而是由爸爸把错题拍照打印贴上，孩子只用红笔在旁边写三句话：\n①我错在哪一步？②正确思路是什么？③下次怎么避免？\n每周日晚上，爸爸随机抽5道错题，让孩子像小老师一样讲出来。讲不清的，下周重复。一个学期下来，错题本越来越薄，成绩却越来越稳。\n.\n第三，睡前半小时，是“记忆黄金期”。\n九点前，孩子会拿出课本，把当天学过的语文古诗、英语单词、数学公式快速读一遍（只读不背），然后关灯睡觉。爸爸说，睡前输入的内容，大脑会在深睡时自动整理和巩固，第二天早上醒来再回忆一遍，记得特别牢。\n.\n第四，周末不补课，只补“思维”。\n高年级应用题增加，娃不会做、没思路，基本上是思维没打开。这点我非常认同，我们也很重视数学思维的培养，大浪淘沙选了一个线上小班，确实很惊喜——因为人少、互动频率高，能很专注。基础＋浅奥，一周两次，现在基本稳定在98+，大难题也能自己整理思路，不用我操心。\n.\n第五，也是最重要的一条——家长“闭嘴”，让孩子自己承担后果。\n如果孩子因为磨蹭导致九点半没写完作业，爸爸会直接收走，签字时如实写上“未完成，已到睡觉时间”。第二天孩子被老师批评后，自然学会抓紧时间。\n.\n最后，送给所有家长一句话：“小学拼的不是谁学得久，而是谁睡得早、醒得清醒。” 深以为然！","images":["6a65fff700000000110128a1_0.jpg"],"coverImage":"6a65fff700000000110128a1_0.jpg","tags":[],"color":2,"scrapedAt":"2026-07-29T10:00:00"},{"title":"没报班，儿子靠看纪录片全班第一。\n.\n经济一降温，我和队友双","author":"萨萨","time":"2026-07-26","url":"https://www.xiaohongshu.com/explore/6a654c170000000011011b2e","topic":"优质好贴","likes":74,"comments":58,"shares":0,"collects":152,"summary":"没报班，儿子靠看纪录片全班第一。\n.\n经济一降温，我和队友双双降薪10%。\n辅导班？真报不起了。\n一咬牙，干脆自己来。\n没想到，这一换——反而找对了路。\n找纪录片、筛好课，陪着看。\n知识暴涨，格局打开。\n省下的钱买些经典教辅，超超竟然学得更来劲了。\n原来，学习本身可以这么有趣。\n.\n🌈 语文 | 一部片就是一座图书馆\n《跟着书本去旅行》855集 ——边走边学，课文活了\n《论语里的大智慧》550集 ——古人智慧，句句入心\n《中国通史》100集 ——脉络清晰，历史不散\n《宗师列传・唐宋八大家》11集 ——文豪生平，有血有肉\n.\n🧮 数学 | 思维比计算更重要\n《像乌鸦一样思考》20集 ——学会观察，学会提问\n《用动画片学奥数》38集 ——烧脑题，动画解\n《神奇的数字》3集 ——数字背后的世界\n《数学的故事》4集 ——从历史看数学\n.\n🌍 英语 | 浸泡在语境里\n《新概念英语动画版》——经典重塑，生动好跟\n《小猪佩奇》——生活口语，轻松入门\n《玛泽的故事》26集 ——剧情有趣，句型重复\n《牛津树英语动画》——分级阅读，动画加持\n.\n⚛️ 物理\n《我的牛顿教练》6集 ——运动奥秘，一看就懂\n《宇宙时空之旅》13集 ——仰望星空，眼界大开\n《科学大实验》40集 ——动手验证，原理可视化\n.\n🧪 化学\n《美丽化学》24集 ——微观反应，震撼之美\n《我们需要化学》6集 ——化学与生活，息息相关\n《门捷列夫很忙》5集 ——元素周期表，有趣有料\n.\n🦠 生物\n《生命的故事》6集 ——从出生到繁衍，生命奇迹\n《种出个地球》3集 ——植物改变星球\n《工作细胞》22集 ——身体里的热血战斗\n.\n🗺️ 地理\n《地球脉动》25集 ——自然纪录片天花板\n《航拍中国》34集 ——俯瞰祖国，心潮澎湃\n《蓝色星球》15集 ——深海奥秘，叹为观止\n.\n【数字开窍，其实有路径💥】\n除了放学后刷优质视频，我们还让娃一周上两次线上数学思维，因为人数少，互动很高频，娃能够很专注。动画+真人互动，外加错题训练，一周两次，现在非常开窍，晚上回家做作业也不需要盯着，自主就能完成。\n.\n没有天价补习班，孩子一样能进步惊人。\n陪伴、筛选、坚持——\n也许，这才是普通家庭最扎实的育儿路\n#纪录片[话题]# #教育孩子[话题]# #父母收藏[话题]# #育儿经验[话题]#  #辣妈育儿笔记[话题]##教育投资[话题]#","images":["6a654c170000000011011b2e_0.jpg"],"coverImage":"6a654c170000000011011b2e_0.jpg","tags":["纪录片","教育孩子","父母收藏","育儿经验","辣妈育儿笔记","教育投资"],"color":3,"scrapedAt":"2026-07-29T10:00:00"},{"title":"1、选小学，离家近就是王道，少在路上折腾，多留时间给学习。\n","author":"萨萨","time":"2026-07-26","url":"https://www.xiaohongshu.com/explore/6a653c22000000001101793c","topic":"优质好贴","likes":30,"comments":28,"shares":0,"collects":35,"summary":"1、选小学，离家近就是王道，少在路上折腾，多留时间给学习。\n2、练字！练字！练字!!至少坚持三年，好处多多。\n3、小学最重要的是培养习惯，同时激发和保护学习兴趣，兴趣才是最好的老师。\n4、成绩不好不可怕，动作慢才要命。用速度换成绩，年级越高，时间就越宝贵。\n5、读书声音小?那可不行!声音越大，记忆越深刻，语感也越好。\n6、别小看预习，这是你超越别人的好机会。\n7、能进重点班就别去普通班，能进名校就别进一般学校。几年后，差距就显现了。\n8、校内学习要紧跟，别脱节。校内搞不定，就别忙着校外拓展。\n9、补习班大多是焦虑税，兴趣班也别乱报，挖掘兴趣才是关键。\n10、身体健康、保护视力、亲子关系，这三点做不到，就别急着鸡娃。\n·\n班主任告诉你，小学规划这样做:\n.\n⭕️[英语学习]\n1⃣️、厉害父母都注重课外拓展、海量阅读。\n2⃣️、英语学不好?那就是懒!多听、多读、多背就对了。\n3⃣️、低年级看动画、听儿歌;高年级听新闻、新概念等。关键是坚持!\n4⃣️、英语单词尽早背。\n5⃣️、课内英语仅面向普通孩子，要想成为优势学科，必须快人一步并持之以恒。\n.\n⭕️ [数学学习]\n1⃣️、立足课本，学有余力再学奥数。别太过看重奥数，基本功才最重要。\n2⃣️、计算基础要打牢，每日必做。《口算笔算天天练》坚持练起来!\n3⃣️、思维拓展不能丢，但别硬啃奥数。我家老二跟风上了一个线上小班，没想到很惊喜，因为人数少，互动很高频，娃能够很专注。动画+真人互动，一周两次。现在基本不需要我们操心。\n4⃣️、别总说孩子粗心，错了就是错了。踏实吃透课本比什么都强。\n.\n⭕️[语文学习]\n1⃣️、一二年级抓拼音、识字量，语文学好了，其他学科也受益。\n2⃣️、坚持课外阅读，提升阅读速度和理解力。从绘本到名著，一步步来学。\n3⃣️、每天晨读，用《337晨读》书，科学晨读代替死记硬背。\n4⃣️、古诗和小古文提前背，培养语感，到了高年级更轻松。\n.\n⭕️[学习习惯养成]\n1⃣️、正确写作业方法:做好准备、用番茄时钟法提升专注力、自行检查并订正。\n2⃣️、远离手机，保护专注力和思考力。\n3⃣️、别忽视孩子的粗心问题，那其实是掌握知识不牢固的表现。\n\t\n#一年级[话题]# #家有小学生[话题]# #辣妈育儿经[话题]#","images":["6a653c22000000001101793c_0.jpg"],"coverImage":"6a653c22000000001101793c_0.jpg","tags":["一年级","家有小学生","辣妈育儿经"],"color":4,"scrapedAt":"2026-07-29T10:00:00"},{"title":"他也才一年级，刚刚7岁而已…\n.\n有一天翻开他的作业本，看到","author":"萨萨","time":"2026-07-25","url":"https://www.xiaohongshu.com/explore/6a63f5f20000000011011924","topic":"优质好贴","likes":54,"comments":38,"shares":0,"collects":26,"summary":"他也才一年级，刚刚7岁而已…\n.\n有一天翻开他的作业本，看到橡皮上密密麻麻全是铅笔戳出的小坑。铅笔歪在草稿纸边，两道数学题擦改写了好几遍，纸都毛了。\n.\n目光再往旁边挪了挪，看到他小手腕上画了块歪歪扭扭的手表，指针停在某个只有他自己才知道的时间。\n.\n一年级的生活，说起来也没那么轻松。练字、口算、英语打卡、跳绳记录……一样一样排队等着他。我们总希望这个小家伙坐有坐相、写有写样、上课小眼睛时刻跟着老师走。\n.\n可我35岁了，偶尔还会忘关煤气灶，凭什么不让这个7岁的小朋友发发呆、画会儿画呢？\n.\n我老家有个亲戚种了一辈子地，他说过，种田的人不会对着庄稼吼，也不指望一夜之间看见谷穗。碰上旱涝，他们知道提前挖渠；每种作物有自己的脾气，该开花的时候开花，该抽穗的时候抽穗；施多少肥，得看那块地的墒情，不是照着书本抄。养孩子，好像也有点这个意思。\n.\n想了很久，我们做了这四件事：\n1️⃣不冲孩子嚷\n孩子闹脾气的时候，我不再说“别哭了”。有一次他哭得厉害，我问：“是不是觉得妈妈没懂你？”后来我们养成一个习惯——先聊感受，再说怎么办。让孩子学会表达心情，比任何规矩都重要，等她再大一点，也不至于把什么事都憋在心里。\n.\n2️⃣不嫌他走得慢\n以前看到闺蜜家孩子成绩好，我也急得不行。后来才知道人家一年级就开始做数学思维训练，我们还在家里乱教。跟着试了一段时间，小班互动多，娃能坐得住，还有错题训练，现在对数学兴趣飙升，写作业和考试都基本不用我们操心。\n.\n3️⃣给他适合的土壤\n我们没报太多兴趣班。有空就带她去菜市场转转、回家拆个旧电饭锅、做点小实验。最近迷上摄影，起因就是一次出门随手拍了张照片竟然很好看。那种自己长出来的兴趣，比任何任务都管用。\n.\n4️⃣带他去“施肥”和“晒太阳”\n我们定了个小目标：一个月爬一次山。坚持“大户外”，在走走停停中，让他自己感受什么叫坚持。\n.\n养孩子啊，有时候真像养一棵会跑的小树苗。我们不是园丁，非得把它修剪成某个样子。我们能做的，不过是调调光照、松松土壤，剩下的，交给时间。\n#育儿感悟[话题]# #一年级日常[话题]# #做个不焦虑的妈妈[话题]# #家庭教育[话题]# #亲子沟通[话题]# #数学思维培养方法[话题]#","images":["6a63f5f20000000011011924_0.jpg"],"coverImage":"6a63f5f20000000011011924_0.jpg","tags":["育儿感悟","一年级日常","做个不焦虑的妈妈","家庭教育","亲子沟通","数学思维培养方法"],"color":0,"scrapedAt":"2026-07-29T10:00:00"},{"title":"7.24后才开始预习四年级，没方向直接抄我的\n.\n七月份已经","author":"萨萨","time":"2026-07-25","url":"https://www.xiaohongshu.com/explore/6a63eba4000000001101f964","topic":"优质好贴","likes":18,"comments":16,"shares":0,"collects":23,"summary":"7.24后才开始预习四年级，没方向直接抄我的\n.\n七月份已经过半了，依依昨天还沉浸在放假的喜悦中，因为跟同学比赛，今年暑假作业已经搞定了\n·\n最近北京的高温仍旧居高不下，让人心生烦躁。打算这个月开始给依依安排预习计划，预习不是卷，而是有备无患！以前依依是不喜欢预习的，但自从上个学期她尝到了预习的甜头后，总分提了15分，名次一下子靠前了，暑假就开始了疯狂预习\n·\n下面我把依依的【三升四暑期预习规划】（普娃逆袭版）分享给大家：\n·\n🌟英语:\n1️⃣每天背诵15个单词，先从复习三年级的开始，有余力再预习四上新单词。\n2️⃣加强句型的学习，和孩子用role-play的形式辅助三下重点课文的背诵。提前预习四上There be句型以及现在进行时、过去时等重难点\n·\n🌟语文:\n1️⃣字词专项\n提前拿下课后三张表，四年级写作业和考试能提速不少\nP123-125识字表会认读，蓝色多音字能分读音会组词 P126-127写字表掌握1字1音1词\nP128-130的词语表开学前两周，每天听写两课\n2️⃣预习重点课文\n课文预习主要分为2类:\n第一类是背诵默写类:如第一课《观潮》3、4段，第二课《走月亮》第4段，第九课《古诗三首》全文等\n第二类是课内阅读常考类，比如课文中心思想、人物品质、表达了作者什么思想感情\n3️⃣重视阅读：语文学习是门童子功，二升三正是培养的黄金时期～提升的阅读和写作能力是我的首要目标。\n·\n🌟数学:\n1️⃣计算：每天20分钟定时练四上重点，错1题加练5道（速度＞难度！）\n2️⃣预习：按照读课本-记概念-推公式-做例题的顺序，预习四上课本，两天1节，会做简单的例题，掌握基本做题思路\n🔹大数的认识\n🔹公顷和平方千米\n🔹角的度量\n🔹三位数乘两位数\n🔹平行四边形和梯形\n🔹除数是两位数的除法\n🔹条形统计图\n3️⃣思维训练：一定要注重数学思维的培养，不然后面很容易跟不上。我们从去年开始每周上2节线上思维，坚持了一年，变化真的明显，现在遇到题目思路特别清晰，学习效率高了很多，成绩也一直很稳定。\n·\n依依不是牛娃，但我时常告诫她：学习就像烧开水，最忌讳学一阵停一阵。就算已经烧到80度，只要一停下，马上就会凉透了。想要再烧，只能重头开始。学习贵在坚持！和各位宝妈共勉！\n#家有小学生[话题]# #小学生的学习习惯[话题]# #四年级[话题]# #暑假[话题]# #新四年级[话题]#","images":["6a63eba4000000001101f964_0.jpg"],"coverImage":"6a63eba4000000001101f964_0.jpg","tags":["家有小学生","小学生的学习习惯","四年级","暑假","新四年级"],"color":1,"scrapedAt":"2026-07-29T10:00:00"},{"title":"张雪峰说：建议小学生借助bilibili平台开展自学！我筛选","author":"萨萨","time":"2026-07-24","url":"https://www.xiaohongshu.com/explore/6a6364a2000000000f029d5a","topic":"优质好贴","likes":41,"comments":40,"shares":0,"collects":70,"summary":"张雪峰说：建议小学生借助bilibili平台开展自学！我筛选出的这27位UP主教学能力出众，实用性极强！\n这次期末考试多多拿了第一名。\n.\n🌟语文\n✅《跟着书本去旅行》： 855 集，每集 18 分钟\n✅《论语里的大智慧》：550 集，每集 5 分钟\n✅《中国通史》：100 集，每集 45 分钟\n✅《宗师列传・唐宋八大家》：11 集，每集 90 分钟\n✅《定风波》：5 集，每集 50 分钟\n✅《唐之韵》：20 集，每集 20 分钟\n.\n🌟英语\n✅《小猪佩奇》：多季，每集 5 - 10 分钟\n✅《汪汪队立大功》：多季，每集 20 分钟左右\n✅《爱冒险的朵拉》：多季，每集 25 分钟左右\n.\n🌟数学\n✅《像乌鸦一样思考》：20 集，每集 10 分钟\n✅《用动画片学奥数》：38 集，每集 6 - 15 分钟\n✅《神奇的数字》：3 集，每集 58 分钟\n.\n🌟物理\n✅《我的牛顿教练》：6 集，每集 25 分钟\n✅《宇宙时空之旅》：13 集，每集 45 分钟\n✅《科学大实验》：40 集，每集 10 分钟\n.\n🌟化学\n✅《美丽化学》：24 集，每集 2 - 3 分钟\n✅《我们需要化学》：6 集，每集 15 分钟\n✅《门捷列夫很忙》：5 集，每集 25 分钟\n.\n🌟政治\n✅《辉煌中国》：6 集，每集 50 分钟\n✅《大国外交》：6 集，每集 45 分钟\n.\n🌟地理\n✅《地球脉动》：3 季共 25 集，每集 60 分钟\n✅《航拍中国》：4 季共 34 集，每集 50 分钟\n✅《蓝色星球》：2 季共 15 集，每集 60 分钟\n.\n🌟生物\n✅《生命的故事》：6 集，每集 60 分钟\n✅《种出个地球》：3 集，每集 60 分钟\n✅《工作细胞》：2 季共 22 集，每集 25 分钟\n——\n【思维开窍核心秘籍👇👇】\n除了假期刷小破站的优质博主视频，我们还让娃一周上两次线上数学思维，因为人数少，互动很高频，娃能够很专注。动画+真人互动，外加错题训练，一周两次。现在非常开窍，晚上回家做作业也不需要盯着，自主就能完成。\n#班主任视角[话题]# #教育孩子[话题]# #儿童纪录片[话题]# #纪录片[话题]# #学霸秘籍[话题]#","images":["6a6364a2000000000f029d5a_0.jpg"],"coverImage":"6a6364a2000000000f029d5a_0.jpg","tags":["班主任视角","教育孩子","儿童纪录片","纪录片","学霸秘籍"],"color":2,"scrapedAt":"2026-07-29T10:00:00"},{"title":"近日，上海一位211爸爸火了，不是因为他是网红，而是他的教育","author":"萨萨","time":"2026-07-24","url":"https://www.xiaohongshu.com/explore/6a62a6b7000000000f0164ea","topic":"优质好贴","likes":2337,"comments":296,"shares":0,"collects":4536,"summary":"近日，上海一位211爸爸火了，不是因为他是网红，而是他的教育方式，每晚让孩子九点半准时睡觉，成绩却能一路开挂，班主任追问后惊讶，他的教育理念竟如此先进！！\n.\n孩子爸爸分享：三年级开始，学习难度逐渐增大，孩子越往高年级会越感到力不从心，要想跟上同龄人的脚步，除了培养好的学习习惯，更重要的是把“高效”刻进骨子里，而不是把“熬夜”当成努力。\n.\n三年级开始，学习难度逐渐增大，很多家长就急着买卷子、报班、延长学习时间。但他反其道而行——坚决不搞疲劳战。\n.\n下面我把爸爸现场掏心窝的5条实操铁律整理出来，姐妹们直接抄作业！📝\n.\n第一，把作业“切割”成三段，杜绝无效磨蹭。\n孩子放学后先休息20分钟（吃点水果、活动一下），然后开始写作业。他把作业分成：\n①抄写类（简单、费时少）→②计算/基础类（中等难度）→③思考类（难题、作文）。前两类在学校延时服务或饭前搞定，第三类留到饭后集中攻克。每完成一段，休息5分钟。这样孩子心里有数，不会一晚上对着所有作业发呆。\n.\n第二，错题本不抄题，只“讲题”。\n他家错题本从不让孩子完整抄题目，而是由爸爸把错题拍照打印贴上，孩子只用红笔在旁边写三句话：\n①我错在哪一步？②正确思路是什么？③下次怎么避免？\n每周日晚上，爸爸随机抽5道错题，让孩子像小老师一样讲出来。讲不清的，下周重复。一个学期下来，错题本越来越薄，成绩却越来越稳。\n.\n第三，睡前半小时，是“记忆黄金期”。\n九点前，孩子会拿出课本，把当天学过的语文古诗、英语单词、数学公式快速读一遍（只读不背），然后关灯睡觉。爸爸说，睡前输入的内容，大脑会在深睡时自动整理和巩固，第二天早上醒来再回忆一遍，记得特别牢。\n.\n第四，周末不补课，只补“思维”。\n高年级应用题增加，娃不会做、没思路，基本上是思维没打开。这点我非常认同，我们也很重视数学思维的培养，大浪淘沙选了一个线上小班，确实很惊喜——因为人少、互动频率高，能很专注。基础＋浅奥，一周两次，现在基本稳定在98+，大难题也能自己整理思路，不用我操心。\n.\n第五，也是最重要的一条——家长“闭嘴”，让孩子自己承担后果。\n如果孩子因为磨蹭导致九点半没写完作业，爸爸会直接收走，签字时如实写上“未完成，已到睡觉时间”。第二天孩子被老师批评后，自然学会抓紧时间。\n.\n最后，送给所有家长一句话：“小学拼的不是谁学得久，而是谁睡得早、醒得清醒。” 深以为然！","images":["6a62a6b7000000000f0164ea_0.jpg"],"coverImage":"6a62a6b7000000000f0164ea_0.jpg","tags":[],"color":3,"scrapedAt":"2026-07-29T10:00:00"},{"title":"一家托举出俩学霸，我们的秘诀：三个小约定\n.\n🌳写作业小约","author":"萨萨","time":"2026-07-24","url":"https://www.xiaohongshu.com/explore/6a629bc5000000000f03235d","topic":"优质好贴","likes":54,"comments":70,"shares":0,"collects":93,"summary":"一家托举出俩学霸，我们的秘诀：三个小约定\n.\n🌳写作业小约定\n1、落座前把该喝的、该跑的、该拿的都搞定，别一会儿起来一趟。\n2、闹铃一响就动笔，不磨蹭、不等\"状态来了\"——越等越懒。\n3、课本、笔尺、本子提前摆好桌角，免得写到一半翻书包翻到分神。\n4、读题不急，用手指点着轻声念一遍，不跳字、不添字。\n5、速度先放一放，笔画写端正比写得快要紧。\n6、腰挺直、脚踩地，不歪不靠不托腮，坐稳了精神才聚得起来。\n7、作业时间不说话、不串座、不东张西望，安安静静啃完。\n8、遇到卡壳的题先跳过去，做个记号回头再想，别在死胡同里耗光耐心。\n9、全部写完后自己从头捋一遍，确认没漏没错再合上本子。\n10、收工后把桌面收拾干净，书本归位、台灯关掉，做事有头有尾。\n.\n🌳阅读积累小约定\n古诗文趁早铺路：小学和初中必背的古诗词，加上16篇核心文言文，争取小学阶段全部过完。这样到了初中，别人还在为背古文熬灯苦战，咱家孩子就能把时间腾给数理化和薄弱科目。\n.\n🌳数学解题小约定\n1、读题至少两遍：第一遍知道大概讲什么，第二遍拿笔把关键数字圈出来。\n2、把条件单独摘出来，画个简单图表或线段图，让思路一下子清晰。\n3、下笔前先想好先算什么、后算什么，草稿纸上试推一步，免得走弯路。\n4、做完后逐项回查：数字抄对没、单位写了没、步骤齐不齐，一个不漏。\n5、每周固定做思维训练，想要高年级不掉队，思维训练一定一定要跟上，非常重要！我们一直在上思维训练，很多都试过，现在上的是大浪淘沙后留下的，小班直播，不是死记硬背和刷题，而是孩子通过画图方式理解题目，主动思考，掌握学习方法，举一反三，适度拔高，现在基本稳定在98＋，不用操心。\n.\n小学六年，拼的不是报了多少班、考了多少分，而是脑子里的底层能力有没有长好。不用花大钱，但需要你沉下心、日复一日。坚持住，孩子会自己跑起来。\n#小学生习惯培养[话题]# #自主学习[话题]# #小学生家长[话题]##育儿心得[话题]#","images":["6a629bc5000000000f03235d_0.jpg"],"coverImage":"6a629bc5000000000f03235d_0.jpg","tags":["小学生习惯培养","自主学习","小学生家长","育儿心得"],"color":4,"scrapedAt":"2026-07-29T10:00:00"},{"title":"没报班，儿子靠看纪录片全班第一。\n.\n经济一降温，我和队友双","author":"萨萨","time":"2026-07-23","url":"https://www.xiaohongshu.com/explore/6a621c8f000000001100694a","topic":"优质好贴","likes":57,"comments":44,"shares":0,"collects":81,"summary":"没报班，儿子靠看纪录片全班第一。\n.\n经济一降温，我和队友双双降薪10%。\n辅导班？真报不起了。\n一咬牙，干脆自己来。\n没想到，这一换——反而找对了路。\n找纪录片、筛好课，陪着看。\n知识暴涨，格局打开。\n省下的钱买些经典教辅，超超竟然学得更来劲了。\n原来，学习本身可以这么有趣。\n.\n🌈 语文 | 一部片就是一座图书馆\n《跟着书本去旅行》855集 ——边走边学，课文活了\n《论语里的大智慧》550集 ——古人智慧，句句入心\n《中国通史》100集 ——脉络清晰，历史不散\n《宗师列传・唐宋八大家》11集 ——文豪生平，有血有肉\n.\n🧮 数学 | 思维比计算更重要\n《像乌鸦一样思考》20集 ——学会观察，学会提问\n《用动画片学奥数》38集 ——烧脑题，动画解\n《神奇的数字》3集 ——数字背后的世界\n《数学的故事》4集 ——从历史看数学\n.\n🌍 英语 | 浸泡在语境里\n《新概念英语动画版》——经典重塑，生动好跟\n《小猪佩奇》——生活口语，轻松入门\n《玛泽的故事》26集 ——剧情有趣，句型重复\n《牛津树英语动画》——分级阅读，动画加持\n.\n⚛️ 物理\n《我的牛顿教练》6集 ——运动奥秘，一看就懂\n《宇宙时空之旅》13集 ——仰望星空，眼界大开\n《科学大实验》40集 ——动手验证，原理可视化\n.\n🧪 化学\n《美丽化学》24集 ——微观反应，震撼之美\n《我们需要化学》6集 ——化学与生活，息息相关\n《门捷列夫很忙》5集 ——元素周期表，有趣有料\n.\n🦠 生物\n《生命的故事》6集 ——从出生到繁衍，生命奇迹\n《种出个地球》3集 ——植物改变星球\n《工作细胞》22集 ——身体里的热血战斗\n.\n🗺️ 地理\n《地球脉动》25集 ——自然纪录片天花板\n《航拍中国》34集 ——俯瞰祖国，心潮澎湃\n《蓝色星球》15集 ——深海奥秘，叹为观止\n.\n【数字开窍，其实有路径💥】\n除了放学后刷优质视频，我们还让娃一周上两次线上数学思维，因为人数少，互动很高频，娃能够很专注。动画+真人互动，外加错题训练，一周两次，现在非常开窍，晚上回家做作业也不需要盯着，自主就能完成。\n.\n没有天价补习班，孩子一样能进步惊人。\n陪伴、筛选、坚持——\n也许，这才是普通家庭最扎实的育儿路\n#纪录片[话题]# #教育孩子[话题]# #父母收藏[话题]# #育儿经验[话题]#  #辣妈育儿笔记[话题]##教育投资[话题]#","images":["6a621c8f000000001100694a_0.jpg"],"coverImage":"6a621c8f000000001100694a_0.jpg","tags":["纪录片","教育孩子","父母收藏","育儿经验","辣妈育儿笔记","教育投资"],"color":0,"scrapedAt":"2026-07-29T10:00:00"},{"title":"#家有小学生[话题]# #家长认知决定孩子未来[话题]# #","author":"萨萨","time":"2026-07-23","url":"https://www.xiaohongshu.com/explore/6a6180c6000000001101d673","topic":"优质好贴","likes":8,"comments":0,"shares":0,"collects":12,"summary":"#家有小学生[话题]# #家长认知决定孩子未来[话题]# #教育孩子[话题]#","images":["6a6180c6000000001101d673_0.jpg","6a6180c6000000001101d673_1.jpg","6a6180c6000000001101d673_2.jpg","6a6180c6000000001101d673_3.jpg"],"coverImage":"6a6180c6000000001101d673_0.jpg","tags":["家有小学生","家长认知决定孩子未来","教育孩子"],"color":1,"scrapedAt":"2026-07-29T10:00:00"},{"title":"放弃期待：小学生是没有内驱力的","author":"根源认知","time":"2026-05-21","url":"https://www.xiaohongshu.com/explore/6a0e7777000000003701f5a3","topic":"小学生学习","likes":2825,"comments":145,"shares":1448,"imgs":1,"summary":"小学生内驱力培养的三大黄金法则\n\t\n1. 认清现实：小学生处于\"内驱力真空期\"\n\t\n• 兴趣消失：三年级后刷题考试取代趣味学习\n\t\n• 意义遥远：考大学/找工作等目标超出认知范围\n\t\n• 成就稀缺：仅少数学生能持续获得成就感\n\t\n• 关键结论：\n\t\n不要对小学生内驱力抱有过高期待，女生表现好更多源于服从性而非自驱力\n\t\n2. 破解之道：成就感再造系统\n\t\n▍偷换成功标准\n• 从\"班级排名\"转为\"自我超越\"：\n\t\n✓ 多背2个单词=胜利\n✓ 考试进步2分=胜利\n✓ 每天死磕1道数学题=胜利\n\t\n▍拆解困难任务\n• 课文背诵→分段完成\n\t\n• 单词记忆→每日2个\n\t\n• 数学提升→专攻1类题型\n\t\n▍核心要诀：\n让孩子体验\"我能做到\"的掌控感，建立\"小赢→再尝试\"的正向循环\n\t\n3. 降低学习痛苦指数\n\t\n必须戒除的三大行为：\n❌ 戒口：不停催促提醒\n❌ 戒手：随时纠错打断\n❌ 戒心：紧盯每个细节\n\t\n正确做法：\n• 作业完成后统一订正\n\t\n• 每天挖掘3个进步点：\n作业提前完成/字迹工整/少上厕所:\n启动彩虹屁模式\n\t\n4. 习惯养成：自动化学习流水线\n\t\n• 本质：解决\"不愿做但必须做\"的事\n\t\n• 特征：\n\t\n✅ 稳定运行\n✅ 低能耗\n✅ 无需意志力\n\t\n像刷牙洗脸一样完成每日学习任务\n\t\n终极心法：\n\t\n1. 不勤奋=学习不够轻松\n\t\n2. 不努力=缺乏正反馈\n\t\n3. 不自律=未建立习惯\n\t\n#青春期教育[话题]# #亲子教育[话题]# #自驱力成长[话题]# #孩子的压力[话题]# #减少孩子的压力[话题]# #降低对孩子的期待值[话题]# #父母成长[话题]# #内驱力[话题]# #孩子的成就感[话题]#  #家庭教育[话题]#","images":["6a0e7777000000003701f5a3_0.jpg"],"coverImage":"6a0e7777000000003701f5a3_0.jpg","color":2,"scrapedAt":"2026-07-22T17:00:00"},{"title":"孩子真正的自驱力，来自三个被满足的感觉","author":"小米妈妈育儿日记","time":"2026-04-09","url":"https://www.xiaohongshu.com/explore/69d72861000000001a030d0a","topic":"小学生学习","likes":1354,"comments":160,"shares":857,"imgs":1,"summary":"心理学研究证实，人主动向上的核心，是三大心理需求被满足：\n✅自主感：拥有掌控感，我的事我说了算\n不用事事替孩子安排，小到穿衣选择、作业顺序，大到周末安排，适当放手给选择权。\n让孩子自己做决定、承担结果，感受到对生活的掌控力，才会主动规划、主动负责，自发产生向上的动力。\n✅成就感：努力被看见，付出被认可\n不只盯着满分、奖状，孩子认真做题的专注、主动做事的担当、受挫后不放弃的坚持，都值得被肯定。\n让他明白“我的努力有意义，我本身就值得被爱”，而非为了讨好父母才努力，才会愿意主动尝试、突破自己。\n✅归属感：无论好坏，都被无条件接纳\n家是孩子永远的底气，让他清晰知道：不管优秀还是平凡、成功还是失败，父母的爱和支持永远都在。\n没有小心翼翼的讨好，没有犯错后的恐惧，内心满是安全感的孩子，才敢大胆探索、无惧挫折，心甘情愿为自己拼搏。\n[赞R]这三种感觉扎根心底，孩子不用催、不用盯，自然会主动向前。\n\t\n#家庭教育[话题]##育儿干货[话题]# #孩子自驱力[话题]# #亲子教育[话题]# #科学育儿[话题]# #父母必看[话题]# #内驱力培养[话题]# #如何唤醒孩子的自驱力[话题]# #培养孩子自驱力[话题]#","images":["69d72861000000001a030d0a_0.jpg"],"coverImage":"69d72861000000001a030d0a_0.jpg","color":3,"scrapedAt":"2026-07-22T17:00:00"},{"title":"超大童历经9个月终于入章！","author":"雷敌思","time":"2025-11-19","url":"https://www.xiaohongshu.com/explore/691ddc00000000001b020835","topic":"小学生学习","likes":4663,"comments":997,"shares":707,"imgs":1,"summary":"听完《火箭女孩》给娃听《怪兽学院》不咋感兴趣，于是直接掏出《驯龙大师》，竟然听得津津有味。没想到入章这么丝滑，更意外的是，我竟然也听懂了[笑哭R]，《火箭女孩》我只能听懂50%，感觉驯龙更简单？\n从三下到四上，历时正正好好9个月，对于起步晚、时间紧迫的10岁超大童，这一路真的很不容易！\n刚开始作为大童根本不习惯单纯靠听输入、觉得闹心[汗颜R]，再后来简单的动画片他觉得幼稚、感兴趣的又太难……当妈的信心被反复蹂躏！我甚至在听力上一度放弃，直到靠阅读raz词汇量上来以后、暑假大火猛攻《小猪佩奇》才见点光。开学以后时间特别紧，每天只有利用上下学路上的时间在车上听，一天也就半小时。\n我们没用听力机，暑假和周末用的是平板和旧手机，资源就是洗马拉雅，一分没花。喜马拉雅记录时长是108小时，实际上应该比这多一些。阅读词汇量对听力是有帮助的，而听完《小猪佩奇》刷raz也更顺畅了。\n回首来时路：\n最早看听《BIG MUZZY》，因为他也没看过什么[偷笑R]，一有时间就听看这个；\n学完razC级别给他先看后听《the big green forest》（强忍着听完[捂脸R]）、《bat and friends》（忍不了没看完也没听完[再见R]）；\n终于遇到感兴趣的《动物王国大冒险》，看1遍听1遍；\n进入崩溃期：《牛津树》不感兴趣、《巫师和猫》不感兴趣；没招了，那就听Raz[叹气R]；\n暑假开始看听《小猪佩奇》，很入迷，前四季看完听，后几季裸听，这才真正接受听力。\n后来他读《方块兔》很喜欢，所以听了1遍；接着听《西游记》，这个在暑假已经看完1遍。因为佩奇语速更快，为巩固成果所以方块兔、西游记我放了1.3倍速给他听，为了用西游记拉听力我还特意买了台词本，没时间看白买了[暗中观察R]，全部听完一遍他说可以再回味一遍，可是我听腻了，所以换了《火箭女孩》也是1.3倍速，直接裸听，有的章节听不太懂，他自己会找时间把听过的看一遍；听完这个他说可以再重听一遍，我又腻了[害羞R]，给他听《怪兽学院》听了2天不太感冒，最终进入《驯龙大师》。\n我们学英语起步很晚，一直阅读领先听力，但是看着大家的帖子慢慢摸索，终于取得阶段性胜利！在这里我要感谢红薯、感谢洗马拉雅，感谢b站，感谢乐于分享的姐妹们，感谢孩子和自己！[完啦R][完啦R][完啦R]\n祝学英语的孩子都尽早入章享受英语！\n#小学生爱好[话题]# #英语学习打卡[话题]# #英语学习原来可以这么有趣[话题]# #英语听力练习[话题]# #英语启蒙[话题]##小学生英语[话题]##小学生听力[话题]#","images":["691ddc00000000001b020835_0.jpg"],"coverImage":"691ddc00000000001b020835_0.jpg","color":4,"scrapedAt":"2026-07-22T17:00:00"},{"title":"我女儿把自己养得很好","author":"不想上班怎么了","time":"2025-04-29","url":"https://www.xiaohongshu.com/explore/68109bf4000000002301cb17","topic":"小学生学习","likes":12790,"comments":509,"shares":956,"imgs":1,"summary":"我们俩很多时候都是各干各的，“相互不用陪对方做事”是我们俩共同的约定。\n所以她习惯了看书写作业时，我在工作或打游戏，我忙着打扫卫生时，她在惬意地看书吃零食。\n\t\n我们从不要求对方同步，更不会去质问对方“凭什么”，所以虽然我看起来很“宠”孩子，但其实小也的动手能力很强，并总是能把自己的生活打理的很“精致”。\n\t\n有时我忙到一半抬头，看到她搬了把椅子到阳台上听着雨声看书，把橙汁倒进高脚杯小酌。\n馋了就自己进厨房煮个土豆，顺便还会问我饿不饿，要不要也来一个。\n有时她会开着小灯，和多比躲在帐篷里看书。\n\t\n9岁的她看过好多好多书，她喜欢模仿书里的人吃早餐时看报纸，吃面包时抹奶酪，课间时夹着两本书在走廊上闲逛，还会偷喝我的咖啡….\n我好笑地任她折腾，反正爱阅读的孩子总有她的精神世界，不用担心会学坏。\n\t\n图1-4 ：试图平衡看书和逗猫两件事，图4是她的“解决方案”\n图5-9：看书、听雨、插花，自得其乐的日常（花瓶是我的啤酒杯）\n图10-12：偶尔也会下厨给自己做一份土豆沙拉。\n图13-17 ：精致的女孩在教多比如何精致地享用猫粮，母爱像冻干一样满出来[偷笑R]…多比内心OS：我服了能不能给我换个大盆，夺影响我干饭呐[鄙视R]\n图18 ：多比——吃饱喝足，卸妆睡觉！\n\t\n#家有小学生[话题]# #富养女儿[话题]# #家居好物[话题]# #家居灵感[话题]# #家有萌宠[话题]# #养猫日常[话题]# #我和我的猫[话题]# #猫咪日常[话题]# #猫咪迷惑行为[话题]#","images":["68109bf4000000002301cb17_0.jpg"],"coverImage":"68109bf4000000002301cb17_0.jpg","color":0,"scrapedAt":"2026-07-22T17:00:00"},{"title":"发现三年级跟不上的孩子，爸妈都有一个通病","author":"想想向上生长","time":"2025-03-30","url":"https://www.xiaohongshu.com/explore/67e91934000000001d02613a","topic":"小学生学习","likes":2690,"comments":345,"shares":481,"imgs":1,"summary":"👩👧昨天邻居来串门，她家娃马上要升三升四了，突然发现孩子做作业越来越吃力，问我这学期怎么规划才能顺利过渡到高年级？\n⬆作为一个二胎老母亲，连夜整理了这份关键期指南，抓住分水岭不踩坑！\n·\n✅3个核心升级\n1️⃣自主学习：作业本旁边放\"问题收集本\"，遇到难题先自己思考5分钟再求助\n2️⃣时间管理：改用\"番茄钟工作法\"（25分钟学习+5分钟休息）\n3️⃣错题复盘：重点❗️比起疯狂刷题，更重要的是培养\"学习闭环\"：预习→听课→复习→检测\n·\n🔴语文\n1️⃣晨读：早上大声朗读20分钟，周一字词，周二古诗，周三课文，周四成语，周五作文素材，周末复习\n2️⃣古诗文：课内的《元日》《清明》等8首古诗，先断句再翻译，然后背诵默写\n3️⃣阅读：每天精读30分钟快乐读书吧，推荐《伊索寓言》《中国古代寓言》\n4️⃣作文：从看图写话过渡为长作文，每周一次命题作文小练笔，写完用deepseek精细化批改，圈出优点+改进点\n·\n🔴英语\n1️⃣好多家长急着让孩子背初中单词，结果基础语法漏洞百出😥\n👉把三下英语书每个单元的\"Let's talk\"背到滚瓜烂熟，比盲目超前有用十倍\n2️⃣推荐用\"影子跟读法\"：播放课本音频，孩子慢0.5秒跟读，每天10分钟\n·\n🔴数学\n1️⃣狠抓计算准确率\n这学期要接触两位数×两位数了，建议每天做5道\"超市计算题\n2️⃣应用题要会画线段图\n很多孩子卡在\"比多比少\"问题上，用不同颜色彩笔画出数量关系，抽象问题变具体\n3️⃣数学思维：三年级是小学的分水岭，数学难度增大，娃如果思维没有跟上，很容易没思路。这块牛娃建议尝试奥数，普娃可以参考浩浩，在周六日的时候数学思维训练\n浩浩跟的是杨易老师，每周2次线上打卡，1次是课本知识讲解和实战练习，搞定三年级知识点。1次是思维专项训练，锻炼数感、逻辑能力\n·\n👉每次听完儿子笔记都做了满满一大本。搭配每天10道浅奥练习，不用再额外刷题，娃也能收获满满。现在坚持了一年多，明显感觉他数学开窍了，都能当小老师，给同学们讲解了！\n·\n💡时间安排\n6:50 晨读\n17:30 计算特训+应用题精练\n18:00 写作业\n20:00 整理错题\n·\n每天留半小时让孩子自由安排，可以是看课外书也可以是发呆！#家有小学生[话题]# #孩子学习[话题]# #小孩教育很重要[话题]# #孩子的进步[话题]# #自主学习[话题]#","images":["67e91934000000001d02613a_0.jpg"],"coverImage":"67e91934000000001d02613a_0.jpg","color":1,"scrapedAt":"2026-07-22T17:00:00"},{"title":"他才一年级啊，别催他了，他真的已经很努力了","author":"一个小布丁(海南旅居ing）","time":"2025-03-26","url":"https://www.xiaohongshu.com/explore/67e3f9bf000000000d016760","topic":"小学生学习","likes":7056,"comments":1644,"shares":2676,"imgs":1,"summary":"早上出门前总在上演慢动作：\n小手揪着两根鞋带\n绕三圈就打成死结\n额头抵在膝盖上憋得通红\n这时候千万别说\"一年级该会了\"\n毕竟昨天他还在幼儿园\n玩滑梯都要老师抱下来\n\t\n翻开他的作业本：\n铅笔字像喝醉的蚂蚁\n橡皮擦破三个洞才写完\"口\"\n\"明\"的日字旁要加三根睫毛\n数学本边栏突然长出恐龙战队\n正在攻打\"13+7\"的城堡\n\t\n课间操总慢半拍\n不是故意捣乱\n校服领子卡着脖子\n运动鞋又有点挤脚\n摔倒了先抬头看有没有人笑\n其实眼泪早就在打转\n但必须等跑过来的瞬间才掉\n\t\n午饭时间最煎熬：\n西兰花必须藏在米饭下\n鸡腿要啃二十分钟\n汤碗里漂浮的葱花\n要一颗颗挑出来排成军队\n别怪他磨蹭\n光是用筷子夹起豌豆\n就花光了所有力气\n\t\n交朋友像小动物互嗅：\n突然推人一把是\"我们一起玩\"\n拽姑娘辫子其实是喜欢\n说\"最讨厌妈妈\"的晚上\n会抱着你的睡衣偷偷闻\n那些横冲直撞的拥抱\n都是还没学会的温柔\n\t\n他们正在经历最艰难的转型：\n从全天候陪玩到坐40分钟\n从随时哭鼻子到\"男生要坚强\"\n那些写反的字母\n算不清的加减法\n不是笨\n是小小身体里\n正在爆发式地重组整个世界\n\t\n下次看见他磨蹭时\n蹲到130公分的高度看看：\n纽扣眼小得像米粒\n走廊瓷砖缝有蚂蚁搬家\n单肩书包总往地上坠\n其实他已经在用最快的速度\n追赶这个庞然大物的世界\n\t\n给这些小男孩多留点时间吧\n春天的小笋子破土前\n总要在地下默默攒很久的劲\n你看他现在还够不到的厨房上柜\n但某个放学的傍晚\n会突然把书包往肩上一甩\n长成能帮你提菜的小小男子汉\n#家有小学生[话题]# #卷娃不如卷自己[话题]# #努力的小孩[话题]# #孩子的进步[话题]# #好好陪伴慢慢长大[话题]# #一年级男生[话题]# #小学生日常[话题]# #成长需要等待[话题]#\n@日常薯 @薯宝宝","images":["67e3f9bf000000000d016760_0.jpg"],"coverImage":"67e3f9bf000000000d016760_0.jpg","color":2,"scrapedAt":"2026-07-22T17:00:00"},{"title":"暑假真正拉开孩子差距的，是家长的执行力","author":"两只神兽的妈","time":"2024-07-05","url":"https://www.xiaohongshu.com/explore/6687c6d2000000001c024628","topic":"小学生学习","likes":1437,"comments":170,"shares":741,"imgs":1,"summary":"暑假真正拉开孩子差距的，是家长的执行力\n暑假真正拉开孩子差距的，是家长的执行力\n寒暑假是拉开孩子们差距的关键时期，结局的好坏，取决于家长是否为孩子的暑期有一个明确的规划\n1、作息规律、养成习惯\n每天保持相同的起居时间，身体会逐渐适应并形成习惯。要让孩子成为一个有规划、有执行力的人，家长需要做出表率。\n比如规定早上八点起床开始学习，就不能今天九点起，明天八点起。假期也不能放松，要保持一致性，帮助孩子养成良好的习惯。稳定的作息能让孩子的精力更集中，学习效率更高。\n2、松弛感和规划相结合\n比如星期天可以让孩子自己规划，他想玩或者做其他事情，只要不违反原则，就支持他。这样不仅让孩子得到放松，也锻炼了他的自我安排能力。过度紧张的安排容易让孩子感到压力山大，适度的放松能提高他们的学习积极性，同时还能培养他们的独立性和自我管理能力。\n3、每日规划\n每天的安排可以分为三大部分：上午、下午和晚上。只需要为这三个时间段制定明确的主题任务，不需要细化到每时每分。\n一天学习四小时左右：上午集中学习；下午美文精读、阅读打卡、做题、运动、培养兴趣；晚上美文精读或复习单词、文言文，睡前听英语磨耳朵，目标明确。\n4、避免时间碎片化\n我很反对学一会儿玩一会儿，把时间弄得很零碎。这样看似在学习，但实际上效率很低，效果也不好。孩子需要连续的专注时间，才能真正提高学习效率。\n长时间的集中学习可以让孩子更深入地理解知识，培养他们的耐心和专注力。避免碎片化的时间安排，可以让孩子在学习中找到成就感，从而增强他们的自信心。\n5、晚上阅读和娱乐\n晚上可以安排安静的阅读或看电影、纪录片。每天阅读时间至少一小时，否则很难进入心流状态。早上没完成的学习任务，下午继续完成，不能玩，要有奖惩措施。通过阅读和观影，孩子可以开阔视野，丰富知识面，同时也是一种很好的放松方式。制定阅读和娱乐的规则，可以让孩子学会自律，保持学习和休息的平衡。\n6、总结反思\n每周末和孩子一起回顾本周的学习情况，看看哪些地方做得好，哪些地方需要改进。总结不仅可以让孩子认识到自己的进步和不足，还能帮助他们找到更有效的学习方法\n#学生[话题]# #暑假[话题]# #暑假作业[话题]# #暑假作业[话题]# #小学生[话题]# #宝妈[话题]# #暑假旅游[话题]# #好习惯养成[话题]# #学习日常[话题]# #好习惯[话题]#","images":["6687c6d2000000001c024628_0.jpg"],"coverImage":"6687c6d2000000001c024628_0.jpg","color":3,"scrapedAt":"2026-07-22T17:00:00"}];

  const checked = document.getElementById('selectAll').checked;
  const data = filterData();
  const start = (currentPage - 1) * itemsPerPage;

  if (urls.length === 0) return;
  // Ask password
  pendingDeleteIdx = -1; // signal batch mode
  document.getElementById('pwInput').value = '';
  document.getElementById('pwError').style.display = 'none';
  document.getElementById('pwOverlay').classList.add('show');
  setTimeout(() => document.getElementById('pwInput').focus(), 100);
  // Store batch URLs temporarily
  window._batchDeleteUrls = urls;
}

function restoreDeleted() {
  if (confirm('恢复所有已删除的帖子？')) {
    clearDeletedUrls();
    showToast('已恢复全部帖子');
  }
}

// ============ Render ============
function getTopics() {
  const set = new Set(sampleData.map(d => d.topic));
  return ['全部', ...Array.from(set).sort()];
}
function renderTopics() {
  const topics = getTopics();
  const bar = document.getElementById('topicBar');
  bar.innerHTML = topics.map(t => {
    const isActive = currentTopic === t;
    return `<button class="topic-pill ${isActive ? 'active' : ''}" onclick="setTopic('${t}')">${t}</button>`;
  }).join('');
}

function setTopic(t) { currentTopic = t; currentPage = 1; selectedSet.clear(); renderCards(); renderTopics(); }

function filterData() {
  let data = sampleData;
  // Exclude deleted items
  const deletedUrls = getDeletedUrls();
  if (deletedUrls.length > 0) {
    data = data.filter(d => !deletedUrls.includes(d.url));
  }
  if (currentTopic !== '全部') data = data.filter(d => d.topic === currentTopic);
  if (searchText) {
    const s = searchText.toLowerCase();
    data = data.filter(d => d.title.toLowerCase().includes(s) || d.author.toLowerCase().includes(s));
  }
  return data;
}

function renderCards() {
  const data = filterData();
  const total = data.length;
  const pages = Math.ceil(total / itemsPerPage) || 1;
  if (currentPage > pages) currentPage = pages;
  const start = (currentPage - 1) * itemsPerPage;
  const pageData = data.slice(start, start + itemsPerPage);
  const grid = document.getElementById('cardsGrid');

  grid.innerHTML = pageData.map((item, i) => {
    const imgCount = Math.min(3, item.imgs);
    const more = item.imgs > 3 ? `<div class="card-img-more">+${item.imgs - 3}</div>` : '';
    const imgs = item.images.slice(0, 3).map((img) => '<img class="card-img" src="images/' + img + '" alt="" onerror="this.style.display=\'none\'">').join('');

    return `<div class="card ${cardColors[item.color]}" onclick="openModal(${start + i})" data-idx="${start + i}">
      <input type="checkbox" class="card-checkbox" data-idx="${start + i}" onclick="event.stopPropagation(); toggleSelect(${start + i}, this.checked)" title="选择此帖">
      <button class="card-delete" data-idx="${start + i}" onclick="event.stopPropagation(); openDeleteDialog(${start + i})" title="删除此帖">×</button>
      <div class="card-top">
        <span class="card-tag">${item.topic}</span>
      </div>
      <div class="card-title">${item.title}</div>
      <div class="card-meta">
        <span><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> ${item.time}</span>
        <span><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg> ${formatNum(item.likes)}</span>
        <span><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg> ${formatNum(item.shares)}</span>
        <span><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg> ${formatNum(item.comments)}</span>
      </div>
      <div class="card-imgs">${imgs}${more}</div>
      <div class="card-footer">
        <div class="card-author">
          ${item.author}
        </div>
        <div class="card-actions">
          <button onclick="event.stopPropagation(); copyRow(${start + i})">复制</button>
          <button onclick="event.stopPropagation(); openModal(${start + i})">详情</button>
        </div>
      </div>
    </div>`;
  }).join('');

  renderPagination(pages);
  updateDeleteButtons();
  // Restore checkbox states
  if (manageMode) {
    updateSelectAllCheckbox();
    updateBatchBtn();
    document.querySelectorAll('.card-checkbox').forEach(cb => {
      const idx = parseInt(cb.dataset.idx);
      if (selectedSet.has(idx)) {
        cb.checked = true;
        cb.closest('.card')?.classList.add('selected');
      }
    });
  }
}

function renderPagination(pages) {
  const p = document.getElementById('pagination');
  if (pages <= 1) { p.innerHTML = ''; return; }
  let btns = '';
  btns += `<button class="page-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>&lt;</button>`;
  for (let i = 1; i <= pages; i++) {
    if (i === 1 || i === pages || (i >= currentPage - 1 && i <= currentPage + 1)) {
      btns += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
    } else if (i === currentPage - 2 || i === currentPage + 2) {
      btns += `<span style="padding:8px;color:#999">...</span>`;
    }
  }
  btns += `<button class="page-btn" onclick="changePage(${currentPage + 1})" ${currentPage === pages ? 'disabled' : ''}>&gt;</button>`;
  p.innerHTML = btns;
}

function changePage(p) { currentPage = p; document.getElementById('selectAll').checked = false; renderCards(); window.scrollTo({top:0,behavior:'smooth'}); }

function formatNum(n) { return n >= 10000 ? (n/10000).toFixed(1) + '万' : n; }

// ============ Modal ============
function openModal(idx) {
  const data = filterData();
  const item = data[idx];
  if (!item) return;
  document.getElementById('modalTitle').textContent = item.title;
  document.getElementById('modalMeta').innerHTML = `
    <span>${item.topic}</span>
    <span>点赞 ${formatNum(item.likes)}</span>
    <span>分享 ${formatNum(item.shares)}</span>
    <span>评论 ${formatNum(item.comments)}</span>
    <span>${item.time}</span>
    <span>${item.imgs} 张图片</span>
  `;
  document.getElementById('modalSummary').textContent = item.summary;
  const imgs = item.images.slice(0, 9).map((img) => '<img src="images/' + img + '" onclick="viewImage(this.src)" onerror="this.style.display=\'none\'">').join('');
  document.getElementById('modalImages').innerHTML = imgs;
  document.getElementById('modalBackdrop').classList.add('show');
}
function closeModal(e) { if (!e || e.target === document.getElementById('modalBackdrop')) document.getElementById('modalBackdrop').classList.remove('show'); }
function viewImage(src) { document.getElementById('viewerImg').src = src; document.getElementById('imgViewer').classList.add('show'); }

// ============ Copy & Export ============
function copyRow(idx) {
  const data = filterData();
  const item = data[idx];
  if (!item) return;
  const text = `标题：${item.title}\n正文：${item.summary}`;
  navigator.clipboard.writeText(text).then(() => showToast('已复制到剪贴板'));
}
function exportCSV() {
  const data = filterData();
  if (!data.length) { showToast('没有可导出的数据'); return; }
  const headers = ['标题','账号名','话题','发布时间','文章链接','点赞','评论','分享','图片数','摘要'];
  const rows = data.map(d => [d.title, d.author, d.topic, d.time, d.url, d.likes, d.comments, d.shares, d.imgs, d.summary].map(v => `"${String(v).replace(/"/g,'""')}"`).join(','));
  const csv = '\ufeff' + [headers.join(','), ...rows].join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '采集数据_' + new Date().toLocaleDateString() + '.csv';
  a.click(); URL.revokeObjectURL(url);
  showToast('CSV 导出成功');
}
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }

// ============ Export JSON (for sync with local files) ============
function exportJSON() {
  const data = filterData();
  if (!data.length) { showToast('没有可导出的数据'); return; }
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], {type:'application/json;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'merged_data_' + new Date().toISOString().slice(0,10) + '.json';
  a.click(); URL.revokeObjectURL(url);
  showToast('JSON 数据已下载');
}

// ============ Management Mode ============
function toggleManage() {
  manageMode = !manageMode;
  const btn = document.getElementById('btnManage');
  const hint = document.getElementById('manageHint');
  const selAll = document.getElementById('selectAll');
  const hintText = document.getElementById('hintText');
  const restoreBtn = document.getElementById('btnRestore');
  if (manageMode) {
    btn.classList.add('active');
    btn.textContent = '🔧 退出管理';
    hint.classList.add('show');
    selAll.style.display = 'inline-block';
    const c = getDeletedUrls().length;
    hintText.textContent = '⚠️ 点 × 删单篇，勾选 + 批量删除可多篇删除';
    if (c > 0) {
      hintText.textContent = '⚠️ 已删除 ' + c + ' 篇 | 点 × 删单篇，勾选 + 批量删除可多篇删除';
      restoreBtn.style.display = 'inline-block';
    }
    selectedSet.clear();
    updateSelectAllCheckbox();
    updateBatchBtn();
  } else {
    btn.classList.remove('active');
    btn.textContent = '🔧 管理模式';
    hint.classList.remove('show');
    selAll.style.display = 'none';
    restoreBtn.style.display = 'none';
    selectedSet.clear();
  }
  updateDeleteButtons();
  renderCards();
}

function updateDeleteButtons() {
  document.querySelectorAll('.card-delete').forEach(btn => {
    btn.classList.toggle('show', manageMode);
  });
  document.querySelectorAll('.card-checkbox').forEach(cb => {
    cb.classList.toggle('show', manageMode);
  });
  document.querySelectorAll('.card').forEach(card => {
    card.classList.toggle('selectable', manageMode);
  });
}

function openDeleteDialog(idx) {
  if (!manageMode) return;
  pendingDeleteIdx = idx;
  document.getElementById('pwInput').value = '';
  document.getElementById('pwError').style.display = 'none';
  document.getElementById('pwOverlay').classList.add('show');
  setTimeout(() => document.getElementById('pwInput').focus(), 100);
}

function closePwDialog() {
  document.getElementById('pwOverlay').classList.remove('show');
  pendingDeleteIdx = -1;
}

function confirmDelete() {
  const pw = document.getElementById('pwInput').value;
  if (pw !== DELETE_PASSWORD) {
    document.getElementById('pwError').style.display = 'block';
    return;
  }
  // Batch delete mode
  if (window._batchDeleteUrls && window._batchDeleteUrls.length > 0) {
    const urls = window._batchDeleteUrls;
    urls.forEach(url => addDeletedUrl(url));
    window._batchDeleteUrls = [];
    document.getElementById('pwOverlay').classList.remove('show');
    selectedSet.clear();
    updateSelectAllCheckbox();
    updateBatchBtn();
    renderCards();
    const c = getDeletedUrls().length;
    const hintText = document.getElementById('hintText');
    const restoreBtn = document.getElementById('btnRestore');
    hintText.textContent = '⚠️ 已删除 ' + c + ' 篇 | 点 × 删单篇，勾选 + 批量删除可多篇删除';
    restoreBtn.style.display = 'inline-block';
    showToast('已批量删除 ' + urls.length + ' 篇');
    return;
  }
  // Single delete mode
  const data = filterData();
  const item = data[pendingDeleteIdx];
  if (!item) { closePwDialog(); return; }
  addDeletedUrl(item.url);
  document.getElementById('pwOverlay').classList.remove('show');
  pendingDeleteIdx = -1;
  selectedSet.delete(pendingDeleteIdx);
  renderCards();
  const c = getDeletedUrls().length;
  const hintText = document.getElementById('hintText');
  const restoreBtn = document.getElementById('btnRestore');
  hintText.textContent = '⚠️ 已删除 ' + c + ' 篇 | 点 × 删单篇，勾选 + 批量删除可多篇删除';
  restoreBtn.style.display = 'inline-block';
  showToast('已删除');
}

// Keyboard support for password dialog
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePwDialog();
  if (e.key === 'Enter' && document.getElementById('pwOverlay').classList.contains('show')) confirmDelete();
});

// ============ Events ============
document.getElementById('searchInput').addEventListener('input', e => { searchText = e.target.value; currentPage = 1; selectedSet.clear(); renderCards(); });

// ============ Init ============
loadData();
</script>
